<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>SCMJ 주록</title>
<meta name="description" content="와인·위스키·맥주를 사진과 별점으로 기록하는 주록. 사진 첨부, 0.5점 별점, 메모, 카테고리, 남편과 실시간 공유. 광고 없이 기기에 저장됩니다.">
<meta name="theme-color" content="#c2335c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SCMJ 주록">
<meta name="color-scheme" content="light">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="64x64" href="favicon.png?v=1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png?v=1">
<style>
/* SCMJ 주록 — 밝은 와인 테마. 외부 리소스·광고·추적 없음. */
:root{
  color-scheme:light;
  --accent:#c2335c;
  --accent-ink:#9c1f45;
  --accent-soft:#fdebf1;
  --gold:#efa51c;
  --gold-ink:#8a6408;
  --gold-soft:#fff5dc;
  --yes:#0b8a66;
  --yes-soft:#e6f7f0;
  --bg:#faf7f9;
  --surface:#ffffff;
  --surface-2:#f6eff2;
  --surface-3:#ece1e6;
  --line:#f1e7eb;
  --line-2:#e6d8de;
  --text:#201820;
  --text-2:#6d5a63;
  --text-3:#a08d96;
  --shadow-s:0 1px 2px rgba(48,16,28,.04);
  --shadow-c:0 1px 2px rgba(48,16,28,.04),0 10px 24px -16px rgba(48,16,28,.22);
  --r:16px;
  --font:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Pretendard Variable","Segoe UI","Helvetica Neue",Arial,"Liberation Sans","DejaVu Sans","Noto Sans KR","Noto Sans",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--font);background:var(--bg);color:var(--text);
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;overscroll-behavior-y:none;
}
body.sheet-open{overflow:hidden}
button{font-family:inherit;color:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:16px;color:var(--text)}
h1,h2,h3,h4,p,ul,ol,li{margin:0;padding:0}
ul,ol{list-style:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#root{
  position:relative;display:flex;flex-direction:column;
  height:100vh;height:100dvh;max-width:560px;margin:0 auto;background:var(--bg);
}
@media (min-width:680px){
  body{background:#efe8ec}
  #root{box-shadow:0 0 0 1px var(--line),0 30px 70px rgba(30,12,22,.13)}
}

/* ---------- app bar ---------- */
.appbar{
  position:relative;z-index:20;flex:0 0 auto;background:var(--surface);
  border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top);
}
.brandrow{display:flex;align-items:center;gap:8px;padding:10px 12px 7px}
.logo{
  width:30px;height:30px;border-radius:10px;flex:0 0 auto;overflow:hidden;
  box-shadow:0 4px 10px -4px rgba(194,51,92,.6);
}
.logo img{width:100%;height:100%;display:block}
.bname{font-size:17px;font-weight:800;letter-spacing:-.03em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{
  width:34px;height:34px;flex:0 0 auto;display:grid;place-items:center;
  border:0;background:transparent;border-radius:10px;color:var(--text-2);
}
.iconbtn:active{background:var(--surface-2)}
.iconbtn svg{width:19px;height:19px;display:block}
.syncpill{
  display:inline-flex;align-items:center;gap:4px;height:30px;padding:0 9px;flex:0 0 auto;
  border-radius:999px;border:1px solid var(--line-2);background:var(--surface);
  color:var(--text-2);font-size:11px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;
  transition:background .15s,color .15s,border-color .15s;
}
.syncpill svg{width:14px;height:14px;flex:0 0 auto}
.syncpill .lbl2{line-height:1}
.syncpill[data-status="live"]{color:#0b8a66;border-color:rgba(16,185,129,.45);background:rgba(16,185,129,.1)}
.syncpill[data-status="sync"]{color:var(--accent-ink);border-color:rgba(194,51,92,.4);background:var(--accent-soft)}
.syncpill[data-status="offline"]{color:#b45309;border-color:rgba(245,158,11,.45);background:rgba(245,158,11,.1)}

/* search */
.searchrow{padding:0 12px 8px}
.searchbox{
  display:flex;align-items:center;gap:7px;height:36px;padding:0 10px;
  background:var(--surface-2);border-radius:11px;border:1px solid transparent;
}
.searchbox:focus-within{border-color:var(--line-2);background:var(--surface)}
.searchbox svg{width:16px;height:16px;color:var(--text-3);flex:0 0 auto}
.searchbox input{
  flex:1 1 auto;min-width:0;border:0;background:transparent;height:100%;padding:0;
  font-size:14px;font-weight:600;outline:none;
}
.searchbox input::placeholder{color:var(--text-3);font-weight:600}
.searchbox .clr{
  width:22px;height:22px;border:0;border-radius:50%;background:var(--surface-3);color:var(--text-2);
  display:none;place-items:center;padding:0;flex:0 0 auto;
}
.searchbox .clr svg{width:12px;height:12px;color:inherit}
.searchbox.hasq .clr{display:grid}

/* category chips */
.catbar{
  display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;padding:0 12px 10px;
  scrollbar-width:none;-ms-overflow-style:none;
}
.catbar::-webkit-scrollbar{display:none}
.cat{
  height:31px;padding:0 10px;border-radius:999px;border:1px solid var(--line-2);
  background:var(--surface);color:var(--text-2);
  font-size:12px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;
  display:inline-flex;align-items:center;gap:4px;flex:0 0 auto;
}
.cat b{font-size:10.5px;font-weight:800;color:var(--text-3);font-variant-numeric:tabular-nums}
.cat[aria-pressed="true"]{background:var(--soft,var(--accent-soft));border-color:var(--c,var(--accent));color:var(--ink,var(--accent-ink))}
.cat[aria-pressed="true"] b{color:inherit;opacity:.7}
.cat:active{background:var(--surface-2)}

/* ---------- scroll body ---------- */
#view{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:var(--bg)}

/* ---------- hero ---------- */
.hero{
  margin:12px 12px 0;background:var(--surface);border:1px solid var(--line);
  border-radius:18px;padding:14px 15px 12px;box-shadow:var(--shadow-c);
}
.hlabel{display:flex;align-items:center;gap:7px}
.hlabel > span:first-child{font-size:12.5px;font-weight:800;color:var(--text-2);letter-spacing:-.01em}
.hbadge{
  margin-left:auto;font-size:10.5px;font-weight:800;color:var(--accent-ink);
  background:var(--accent-soft);border-radius:999px;padding:3px 8px;letter-spacing:-.02em;
}
.hcount{
  margin-top:3px;display:flex;align-items:baseline;gap:5px;
  font-size:32px;line-height:1.15;font-weight:800;letter-spacing:-.04em;
  font-variant-numeric:tabular-nums;
}
.hcount small{font-size:14px;font-weight:800;color:var(--text-2);letter-spacing:-.02em}
.hsub{margin-top:2px;font-size:12px;font-weight:600;color:var(--text-3)}
.hstats{display:flex;margin-top:12px;padding-top:11px;border-top:1px solid var(--line)}
.hstats > div{flex:1 1 0;min-width:0;text-align:center;padding:0 3px;border-left:1px solid var(--line)}
.hstats > div:first-child{border-left:0}
.hstats b{
  display:block;font-size:13.5px;font-weight:800;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.hstats small{display:block;margin-top:1px;font-size:10.5px;font-weight:700;color:var(--text-3)}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:3px;margin:12px 12px 0;background:var(--surface-2);border-radius:12px;padding:3px}
.tabs button{
  flex:1;height:33px;border:0;background:transparent;border-radius:9px;
  font-size:13px;font-weight:800;letter-spacing:-.02em;color:var(--text-2);
}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(48,16,28,.1)}

/* ---------- list ---------- */
.listbar{display:flex;align-items:center;gap:5px;padding:12px 13px 2px}
.lcount{font-size:11.5px;font-weight:800;color:var(--text-3);letter-spacing:-.01em}
.lspacer{flex:1 1 auto}
.sbtn{
  height:29px;padding:0 10px;border-radius:999px;border:1px solid var(--line-2);
  background:var(--surface);color:var(--text-2);font-size:11.5px;font-weight:800;letter-spacing:-.02em;
  white-space:nowrap;
}
.sbtn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.sbtn.rate[aria-pressed="true"]{background:var(--gold-soft);border-color:#ecc766;color:var(--gold-ink)}
.listwrap{padding:8px 12px calc(88px + env(safe-area-inset-bottom))}
.mgroup{margin-bottom:11px}
.mhead{display:flex;align-items:baseline;gap:7px;padding:2px 4px 7px}
.mhead h3{font-size:12px;font-weight:800;color:var(--text-2);letter-spacing:-.01em}
.msub{margin-left:auto;font-size:11px;font-weight:700;color:var(--text-3);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.rcard{
  display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:10px;margin-bottom:8px;box-shadow:var(--shadow-s);transition:transform .12s ease;
}
.rcard:active{transform:scale(.994);background:#fffdff}
.thumb{
  width:62px;height:62px;border-radius:11px;overflow:hidden;flex:0 0 auto;
  background:var(--surface-2);display:grid;place-items:center;font-size:26px;line-height:1;position:relative;
}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.rmain{flex:1 1 auto;min-width:0}
.rline1{display:flex;align-items:baseline;gap:7px}
.rname{flex:1 1 auto;min-width:0;font-size:14.8px;font-weight:800;letter-spacing:-.025em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrate{
  flex:0 0 auto;font-size:11px;font-weight:800;color:var(--gold-ink);
  background:var(--gold-soft);border-radius:999px;padding:2px 7px;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;
}
.rrate.none{color:var(--text-3);background:var(--surface-2)}
.rline2{display:flex;align-items:center;gap:5px;margin-top:5px;min-width:0}
.rcat{
  font-size:10.5px;font-weight:800;border-radius:6px;padding:2px 6px;letter-spacing:-.02em;
  background:var(--soft,var(--surface-2));color:var(--ink,var(--text-2));white-space:nowrap;flex:0 0 auto;
}
.rdate{font-size:11px;font-weight:700;color:var(--text-3);font-variant-numeric:tabular-nums;flex:0 0 auto}
.ragain{
  margin-left:auto;font-size:10.5px;font-weight:800;border-radius:6px;padding:2px 6px;
  background:var(--yes-soft);color:var(--yes);letter-spacing:-.02em;white-space:nowrap;flex:0 0 auto;
}
.ragain.no{background:var(--surface-2);color:var(--text-3)}
.rmemo{
  margin-top:5px;font-size:11.8px;font-weight:500;color:var(--text-2);line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word;
}
.rplace{margin-top:4px;font-size:11px;font-weight:600;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.listfoot{text-align:center;font-size:11px;font-weight:600;color:var(--text-3);padding:4px 0 2px;line-height:1.5}

/* empty */
.empty{
  margin:16px 4px;padding:28px 18px;text-align:center;background:var(--surface);
  border:1px dashed var(--line-2);border-radius:var(--r);
}
.empty .eicon{
  width:46px;height:46px;border-radius:15px;background:var(--accent-soft);color:var(--accent-ink);
  display:grid;place-items:center;margin:0 auto 10px;
}
.empty .eicon svg{width:25px;height:25px}
.empty b{display:block;font-size:15px;font-weight:800;letter-spacing:-.02em}
.empty p{margin-top:5px;font-size:12.5px;color:var(--text-2);line-height:1.5}
.empty .btn{margin-top:14px;width:100%}
.empty.sm{padding:24px 18px}

/* ---------- gallery ---------- */
.gallery{
  display:grid;grid-template-columns:repeat(3,1fr);gap:6px;
  padding:12px 12px calc(88px + env(safe-area-inset-bottom));
}
.gcell{
  position:relative;aspect-ratio:1/1;border-radius:12px;overflow:hidden;border:1px solid var(--line);
  background:var(--surface-2);padding:0;display:block;width:100%;
}
.gcell img{width:100%;height:100%;object-fit:cover;display:block}
.gcell .gover{
  position:absolute;left:0;right:0;bottom:0;padding:16px 6px 5px;text-align:left;
  background:linear-gradient(180deg,rgba(28,8,16,0),rgba(28,8,16,.74));
}
.gcell .gover b{display:block;font-size:10.5px;font-weight:800;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcell .gover span{display:block;font-size:9.5px;font-weight:800;color:#ffdf9b;font-variant-numeric:tabular-nums}

/* ---------- stats ---------- */
.statswrap{padding:12px 12px calc(88px + env(safe-area-inset-bottom))}
.panel{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 14px;margin-bottom:10px;box-shadow:var(--shadow-s);
}
.panel h3{font-size:12px;font-weight:800;color:var(--text-2);letter-spacing:.01em;margin-bottom:9px}
.panel.total{padding:13px 14px 11px}
.ptop{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.plabel{font-size:12px;font-weight:800;color:var(--text-2)}
.pval{font-size:19px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.statgrid{display:flex;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.statgrid > div{flex:1 1 0;min-width:0;text-align:center;padding:0 4px;border-left:1px solid var(--line)}
.statgrid > div:first-child{border-left:0}
.statgrid b{display:block;font-size:13px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.statgrid small{display:block;font-size:10.5px;color:var(--text-3);font-weight:700;margin-top:1px}
.rrow{display:flex;align-items:center;gap:8px;height:24px}
.rrow .mm{width:26px;flex:0 0 auto;font-size:11px;font-weight:700;color:var(--text-2);font-variant-numeric:tabular-nums}
.btrack{flex:1 1 auto;height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;min-width:18px}
.bfill{display:block;height:100%;border-radius:999px;background:var(--gold);min-width:0}
.rrow .rv{width:74px;flex:0 0 auto;text-align:right;font-size:11px;font-weight:800;color:var(--text-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.crow{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line)}
.crow:first-of-type{border-top:0;padding-top:2px}
.crow .ce{width:22px;flex:0 0 auto;font-size:15px;text-align:center}
.crow .cn{flex:0 1 auto;max-width:38%;min-width:0;font-size:13px;font-weight:700;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .cc{flex:0 0 auto;width:28px;text-align:right;font-size:11px;font-weight:700;color:var(--text-3);font-variant-numeric:tabular-nums}
.crow .cv{flex:0 0 auto;width:46px;text-align:right;font-size:12px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.crow .cbar{flex:1 1 auto;width:auto;min-width:26px;max-width:110px;height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.crow .cbar i{display:block;height:100%;border-radius:999px;background:var(--c,var(--accent))}
.wl{display:flex;gap:7px}
.wlc{flex:1 1 0;min-width:0;border-radius:11px;padding:9px 4px;text-align:center;background:var(--surface-2)}
.wlc b{display:block;font-size:16px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.wlc small{display:block;font-size:10.5px;font-weight:700;color:var(--text-2);margin-top:1px}
.wlc.yes{background:var(--yes-soft)} .wlc.yes b{color:var(--yes)}
.wlc.rate{background:var(--gold-soft)} .wlc.rate b{color:var(--gold-ink)}
.feeline{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:10px;padding-top:9px;border-top:1px solid var(--line)}
.feeline span{font-size:11.5px;font-weight:700;color:var(--text-3)}
.feeline b{font-size:13px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.toplist{display:flex;flex-direction:column}
.toprow{display:flex;align-items:baseline;gap:7px;padding:6px 0;border-top:1px solid var(--line);font-size:12.5px}
.toprow:first-child{border-top:0;padding-top:1px}
.toprow .tn{flex:1 1 auto;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toprow .tr{flex:0 0 auto;font-weight:800;color:var(--gold-ink);font-variant-numeric:tabular-nums}
.hint{font-size:11.5px;font-weight:600;color:var(--text-3);padding:6px 1px 0;line-height:1.5}

/* ---------- fab ---------- */
.fab{
  position:absolute;right:14px;bottom:calc(env(safe-area-inset-bottom) + 16px);
  height:45px;padding:0 17px 0 14px;border:0;border-radius:999px;
  background:var(--accent);color:#fff;font-size:14px;font-weight:800;letter-spacing:-.02em;
  display:flex;align-items:center;gap:6px;z-index:25;white-space:nowrap;
  box-shadow:0 10px 24px -8px rgba(156,31,69,.6),0 2px 6px rgba(48,16,28,.12);
}
.fab svg{width:17px;height:17px;display:block}
.fab:active{background:#ab2a50}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(44,16,28,.38);z-index:60;animation:fade .16s ease-out}
.sheet{
  position:fixed;left:0;right:0;bottom:0;margin:0 auto;z-index:61;width:100%;max-width:560px;
  background:var(--surface);border-radius:20px 20px 0 0;box-shadow:0 -10px 40px rgba(44,16,28,.22);
  max-height:92dvh;display:flex;flex-direction:column;
  animation:up .22s cubic-bezier(.22,.8,.24,1);padding-bottom:env(safe-area-inset-bottom);
}
@keyframes up{from{transform:translateY(20px);opacity:.55}to{transform:translateY(0);opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet-head{display:flex;align-items:center;gap:8px;padding:14px 14px 6px;flex:0 0 auto;position:relative}
.sheet-head .grab{position:absolute;left:50%;top:6px;transform:translateX(-50%);width:36px;height:4px;border-radius:2px;background:var(--surface-3)}
.sheet-head h2{font-size:16px;font-weight:800;letter-spacing:-.02em;flex:1;min-width:0}
.act{
  width:30px;height:30px;border:0;border-radius:9px;background:transparent;
  color:var(--text-3);display:grid;place-items:center;padding:0;flex:0 0 auto;
}
.act:active{background:var(--surface-2);color:var(--text)}
.act svg{width:17px;height:17px;display:block}
.sheet-body{overflow-y:auto;padding:2px 14px calc(16px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.sheet-foot{
  flex:0 0 auto;display:flex;flex-direction:column;gap:8px;
  padding:9px 14px calc(12px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);background:var(--surface);
}
.footsum{display:flex;align-items:baseline;gap:8px;padding:0 2px}
.footsum .fsl{font-size:11.5px;font-weight:800;color:var(--text-3);letter-spacing:.01em}
.footsum b{font-size:16px;font-weight:800;letter-spacing:-.02em}
.footsum .fsr{margin-left:auto;font-size:12px;font-weight:800;color:var(--gold-ink);font-variant-numeric:tabular-nums}
.footbtns{display:flex;gap:7px}
.btn{
  height:44px;padding:0 15px;border-radius:11px;border:1px solid var(--line-2);
  background:var(--surface);font-size:14.5px;font-weight:800;color:var(--text);
  letter-spacing:-.02em;flex:0 0 auto;
}
.btn:active{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;flex:2}
.btn.primary:active{background:#ab2a50}
.btn.ghost{color:#b42318;border-color:rgba(180,35,24,.24);flex:0 1 auto;min-width:74px}
.btn.danger-fill{background:#b42318;border-color:#b42318;color:#fff}
.btn.wide{width:100%;margin-top:10px;flex:1 1 auto}

/* form */
.lbl{display:block;font-size:11.5px;font-weight:800;color:var(--text-3);letter-spacing:.01em;margin:13px 0 5px}
.field{
  width:100%;height:44px;border:1px solid var(--line-2);border-radius:11px;background:var(--surface);
  padding:0 12px;font-size:15px;font-weight:600;color:var(--text);
}
.field::placeholder{color:var(--text-3);font-weight:500}
.field:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(194,51,92,.14)}
textarea.field{height:auto;min-height:70px;padding:10px 12px;line-height:1.5;resize:vertical;font-weight:500}
.field.ro{background:var(--surface-2);color:var(--text-2);font-size:13px;font-weight:700}
.field.ro:focus{border-color:var(--line-2);box-shadow:none}
.inrow{position:relative;display:flex;align-items:center}
.inrow .field{padding-right:36px;font-variant-numeric:tabular-nums;text-align:right;font-weight:700}
.inrow .unit{position:absolute;right:12px;font-size:12.5px;font-weight:800;color:var(--text-3);pointer-events:none}
.tworow{display:flex;gap:7px}
.tworow > *{flex:1 1 0;min-width:0}
.tworow .inrow .field{padding-left:10px;padding-right:32px}
.tworow .unit{right:10px;font-size:11.5px}
.chiprow{display:flex;flex-wrap:wrap;gap:5px;margin:2px 0 2px}
.chip-sel{
  height:31px;padding:0 11px;border:1px solid var(--line-2);border-radius:999px;
  background:var(--surface);color:var(--text-2);font-size:12.5px;font-weight:800;letter-spacing:-.02em;
}
.chip-sel[aria-pressed="true"]{background:var(--soft,var(--accent-soft));border-color:var(--c,var(--accent));color:var(--ink,var(--accent-ink))}
.chip-sel[aria-pressed="true"][data-again="yes"]{background:var(--yes-soft);border-color:rgba(11,138,102,.45);color:var(--yes)}
.chip-sel[aria-pressed="true"][data-again="no"]{background:var(--surface-2);border-color:var(--line-2);color:var(--text-2)}
.chip-sel:active{background:var(--surface-2)}

/* stars */
.starin{display:flex;align-items:center;gap:3px;padding:1px 0 0;flex-wrap:wrap}
.star{position:relative;width:34px;height:34px;flex:0 0 auto;display:block}
.star .sb,.star .sf{
  position:absolute;left:0;top:0;font-size:30px;line-height:34px;text-align:center;
  width:100%;height:100%;display:block;overflow:hidden;white-space:nowrap;
}
.star .sb{color:#eadfe4}
.star .sf{color:var(--gold);width:0}
.star .sh{
  position:absolute;top:0;height:100%;width:50%;border:0;background:transparent;padding:0;z-index:2;
}
.star .sh.l{left:0}
.star .sh.r{left:50%}
.rnum{font-size:16px;font-weight:800;letter-spacing:-.02em;margin-left:5px;font-variant-numeric:tabular-nums;min-width:34px;color:var(--text)}
.rnum.none{color:var(--text-3);font-size:13px}
.rclear{
  margin-left:auto;height:26px;padding:0 9px;border-radius:999px;border:1px solid var(--line-2);
  background:var(--surface);color:var(--text-3);font-size:11px;font-weight:800;
}

/* photo */
.pickrow{display:flex;gap:7px;margin-top:2px}
.pickbtn{
  flex:1 1 auto;height:44px;border-radius:11px;border:1px solid var(--line-2);background:var(--surface);
  display:flex;align-items:center;justify-content:center;gap:7px;font-size:13.5px;font-weight:800;color:var(--text-2);
}
.pickbtn svg{width:18px;height:18px}
.pickbtn.primary{background:var(--accent-soft);border-color:rgba(194,51,92,.3);color:var(--accent-ink)}
.pickbtn:active{background:var(--surface-2)}
.pdrop{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  height:100px;border:1.5px dashed var(--line-2);border-radius:13px;background:var(--surface-2);
  color:var(--text-3);font-size:12px;font-weight:700;
}
.pdrop svg{width:22px;height:22px}
.pprev{position:relative;border-radius:13px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2)}
.pprev img{display:block;width:100%;max-height:200px;object-fit:cover}
.pprev .pbtns{position:absolute;right:8px;bottom:8px;display:flex;gap:6px}
.pprev .pbtn{
  height:30px;padding:0 10px;border-radius:999px;border:0;background:rgba(30,10,18,.74);
  color:#fff;font-size:12px;font-weight:800;backdrop-filter:blur(2px);
}
.pinfo{font-size:11px;font-weight:600;color:var(--text-3);margin-top:5px}

/* detail */
.dphoto{display:block;width:100%;max-height:300px;object-fit:cover;border-radius:14px;border:1px solid var(--line);background:var(--surface-2)}
.dph{display:flex;align-items:center;justify-content:center;height:150px;border-radius:14px;background:var(--surface-2);font-size:52px}
.dhead{display:flex;align-items:baseline;gap:8px;margin-top:11px}
.dname{flex:1 1 auto;min-width:0;font-size:18.5px;font-weight:800;letter-spacing:-.03em;word-break:break-word}
.drate{flex:0 0 auto;font-size:13px;font-weight:800;color:var(--gold-ink);font-variant-numeric:tabular-nums}
.dmeta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px}
.dmemo{
  margin-top:12px;padding:11px 12px;border-radius:12px;background:var(--surface-2);
  font-size:13.5px;font-weight:500;color:var(--text);line-height:1.6;white-space:pre-wrap;word-break:break-word;
}
.drows{margin-top:12px;border-top:1px solid var(--line)}
.drow{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:9px 1px;border-bottom:1px solid var(--line)}
.drow span{font-size:12px;font-weight:700;color:var(--text-3)}
.drow b{font-size:13px;font-weight:800;letter-spacing:-.02em;text-align:right;word-break:break-word}

/* more / sync */
.menulist{display:flex;flex-direction:column;margin-top:2px}
.menulist button{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:13px 2px;
  border:0;border-bottom:1px solid var(--line);background:transparent;
  font-size:14.5px;font-weight:700;letter-spacing:-.02em;color:var(--text);
}
.menulist button:last-child{border-bottom:0}
.menulist button svg{width:18px;height:18px;color:var(--text-2);flex:0 0 auto}
.menulist button.danger{color:#b42318}
.menulist button.danger svg{color:#b42318}
.menulist button:active{background:var(--surface-2)}
.cmsg{font-size:13.5px;color:var(--text-2);line-height:1.55;white-space:pre-line;padding:2px 1px 10px}
.syncbox{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:2px 0 10px;padding:11px 12px;
  border-radius:12px;background:var(--surface-2);border:1px solid var(--line);
}
.syncbox .sdot{width:8px;height:8px;border-radius:50%;background:var(--text-3);flex:0 0 auto}
.syncbox b{font-size:14px;font-weight:800;letter-spacing:-.02em}
.syncbox code{margin-left:auto;font-size:12px;font-weight:800;color:var(--text-2);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:3px 7px}
.syncbox[data-status="live"] .sdot{background:#10b981;box-shadow:0 0 0 3px rgba(16,185,129,.16)}
.syncbox[data-status="sync"] .sdot{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.syncbox[data-status="offline"] .sdot{background:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,.16)}
.formrow{display:flex;gap:7px;align-items:center;margin-top:6px}
.rowbtns{display:flex;gap:7px;margin-top:10px}
.rowbtns .btn{flex:1 1 0;min-width:0}
.notice{
  display:flex;align-items:center;gap:9px;margin:10px 12px 0;padding:9px 11px;
  background:var(--accent-soft);border-radius:11px;font-size:12px;font-weight:600;color:var(--text-2);line-height:1.4;
}

/* ---------- 임시 저장 (작성 중 글) — 한 줄짜리로 절제 ---------- */
.draftbar{
  display:flex;align-items:center;gap:8px;width:calc(100% - 24px);margin:0 12px 8px;
  padding:9px 11px;border-radius:12px;border:1px solid #f0dcae;background:#fff9ea;
  color:#7d5a10;font:inherit;text-align:left;cursor:pointer;
}
.draftbar .dbi{display:flex;flex:0 0 auto;width:17px;height:17px;color:#b8860b}
.draftbar .dbi svg{width:17px;height:17px;display:block}
.draftbar .dbt{flex:1;min-width:0;font-size:12px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.draftbar .dba{flex:0 0 auto;font-size:11.5px;font-weight:800;color:#a2700a}
.dnote{
  display:flex;align-items:center;gap:9px;margin:0 0 2px;padding:8px 10px;
  border-radius:11px;background:#fff9ea;border:1px solid #f2ddb0;
}
.dnote span{flex:1;min-width:0;font-size:11.5px;font-weight:700;color:#7d5a10;line-height:1.35}
.dnote .dlink{
  flex:0 0 auto;padding:5px 9px;border-radius:8px;border:1px solid #e6c886;background:#fff;
  color:#96660a;font:inherit;font-size:11.5px;font-weight:800;cursor:pointer;
}
.dstat{
  display:inline-block;margin-left:7px;font-size:10.5px;font-weight:700;color:var(--text-3);
  letter-spacing:0;opacity:0;transition:opacity .2s;
}
.dstat.on{opacity:1}
.dstat.warn{opacity:1;color:var(--accent-ink)}

/* ---------- toast ---------- */
#toast{
  position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 74px);
  transform:translate(-50%,8px);z-index:80;background:rgba(32,12,22,.94);color:#fff;
  font-size:13px;font-weight:700;letter-spacing:-.01em;padding:9px 15px;border-radius:999px;
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;max-width:86vw;text-align:center;
}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:359px){
  .bname{font-size:16px}
  .cat{height:29px;font-size:11.5px;padding:0 9px}
  .hcount{font-size:28px}
  .syncpill .lbl2{display:none}
  .syncpill{padding:0 8px}
  .gallery{gap:4px}
}

/* ==================================================================
   PC (900px 이상) — 같은 화면을 넓게 펼친다.
   모바일 규칙(위)은 그대로 두고 여기서만 갈아 끼우며, DOM 구조·셀렉터는 바꾸지 않는다.
   ================================================================== */
.pcadd{display:none}      /* 헤더 기록 버튼은 PC 에서만 */
.pdrophint{display:none}  /* "끌어다 놓기" 안내도 PC 에서만 */

@keyframes pop{from{opacity:0;transform:translate(-50%,-48%) scale(.985)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}

@media (min-width:900px){
  body{background:#f1e8ed;font-size:15px}
  #root{max-width:none;width:100%;height:100vh;height:100dvh;box-shadow:none}

  /* ---------- 앱바: 전체 폭, 내용은 1180px 중앙 ---------- */
  .appbar{border-bottom:1px solid var(--line-2);box-shadow:0 1px 0 rgba(48,16,28,.04)}
  .abin{
    max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;
    gap:8px 12px;padding:12px 26px 9px;
  }
  .brandrow{display:contents}
  .logo{order:0;width:34px;height:34px;border-radius:11px}
  .bname{order:1;flex:0 0 auto;max-width:220px;font-size:18px}
  .searchrow{order:2;flex:1 1 300px;min-width:180px;padding:0}
  .searchbox{height:38px;border-radius:12px}
  .searchbox input{font-size:14.5px}
  .pcadd{
    order:3;display:inline-flex;align-items:center;gap:5px;height:36px;padding:0 15px;
    border:0;border-radius:11px;background:var(--accent);color:#fff;white-space:nowrap;
    font-size:13.5px;font-weight:800;letter-spacing:-.02em;
    box-shadow:0 6px 16px -10px rgba(156,31,69,.7);
    transition:background .14s,transform .12s,box-shadow .14s;
  }
  .pcadd svg{width:15px;height:15px;display:block}
  .pcadd:hover{background:#ab2a50;box-shadow:0 10px 22px -12px rgba(156,31,69,.85)}
  .pcadd:active{transform:translateY(1px)}
  #syncpill{order:4;height:34px;font-size:11.5px;transition:background .14s,color .14s,border-color .14s}
  .syncpill:hover{border-color:var(--accent);color:var(--accent-ink)}
  .iconbtn[data-act="openMore"]{order:5;width:36px;height:36px;transition:background .14s,color .14s}
  .iconbtn[data-act="openMore"]:hover{background:var(--surface-2);color:var(--text)}
  .catbar{
    order:6;flex:1 1 100%;width:100%;flex-wrap:wrap;overflow:visible;gap:6px;padding:2px 0 0;
  }
  .cat{height:30px;transition:background .14s,border-color .14s,color .14s}
  .cat:hover{background:var(--surface-2);border-color:var(--line-2)}
  .cat[aria-pressed="true"]:hover{background:var(--soft,var(--accent-soft))}

  /* ---------- 본문: 왼쪽 요약·탭 + 오른쪽 넓은 내용 ---------- */
  .pcshell{
    display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:24px;align-items:start;
    max-width:1180px;margin:0 auto;padding:20px 26px 40px;
  }
  .pcside{position:sticky;top:14px;min-width:0}
  .pcmain{min-width:0}
  .draftbar{width:auto;margin:0 0 12px}

  .hero{margin:0 0 12px;padding:16px 17px 13px}
  .hcount{font-size:36px}
  .hsub{font-size:12.5px}
  .tabs{
    flex-direction:column;gap:3px;margin:0;padding:5px;
    background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-s);
  }
  .tabs button{
    flex:0 0 auto;width:100%;height:40px;padding:0 13px;border-radius:10px;
    display:flex;align-items:center;text-align:left;font-size:13.5px;
    transition:background .14s,color .14s;
  }
  .tabs button:hover{background:var(--surface-2);color:var(--text)}
  .tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent-ink);box-shadow:none}
  .tabs button[aria-selected="true"]:hover{background:#fbdde7}

  /* 내역 — 넓은 화면에서는 2열 카드 (1000px 이상: 카드가 좁으면 배지가 잘려서 1열) */
  .listwrap{padding:0}
  .listbar{padding:0 2px 10px;gap:6px}
  .mgroup{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;margin-bottom:20px}
  .mhead{grid-column:1/-1;padding:0 2px 1px}
  .mgroup .rcard{margin-bottom:0}
  .rcard{padding:12px;transition:transform .12s ease,box-shadow .16s ease,border-color .16s ease}
  .rcard:hover{
    transform:translateY(-1px);border-color:#e7d5dc;
    box-shadow:0 2px 4px rgba(48,16,28,.04),0 14px 26px -18px rgba(48,16,28,.5);
  }
  .rcard:active{transform:none;background:var(--surface)}
  .thumb{width:66px;height:66px}
  .sbtn{transition:background .14s,border-color .14s}
  .sbtn:hover{background:var(--surface-2)}
  .listwrap .empty{max-width:520px;margin:6px auto}

  /* 사진 — 다열 그리드 */
  .gallery{grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:12px;padding:0}
  .gcell{border-radius:14px;transition:transform .14s ease,box-shadow .16s ease}
  .gcell:hover{transform:translateY(-2px);box-shadow:0 16px 30px -20px rgba(48,16,28,.55)}
  .gcell:hover .gover{background:linear-gradient(180deg,rgba(28,8,16,.06),rgba(28,8,16,.82))}
  .gcell .gover b{font-size:11.5px}

  /* 통계 — 2열 패널 (전체 요약은 가로로) */
  .statswrap{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:0;align-items:start}
  .panel{margin-bottom:0}
  .panel.total{grid-column:1/-1}
  .statswrap .empty{grid-column:1/-1;max-width:520px;margin:6px auto}

  /* ---------- 시트: 바텀시트 → 화면 가운데 모달 ---------- */
  .sheet{
    top:50%;left:50%;right:auto;bottom:auto;margin:0;transform:translate(-50%,-50%);
    width:min(560px,92vw);max-width:560px;max-height:86vh;border-radius:20px;padding-bottom:0;
    box-shadow:0 30px 80px -26px rgba(44,16,28,.45),0 2px 10px rgba(44,16,28,.14);
    animation:pop .18s cubic-bezier(.22,.8,.24,1);
  }
  .sheet .grab{display:none}
  .sheet-head{padding:16px 18px 8px}
  .sheet-body{padding:2px 18px 16px}
  .sheet-foot{padding:10px 18px 14px;border-bottom-left-radius:20px;border-bottom-right-radius:20px}

  /* 버튼·목록 hover */
  .act{transition:background .14s,color .14s}
  .act:hover{background:var(--surface-2);color:var(--text)}
  .menulist button{transition:background .14s}
  .menulist button:hover{background:var(--surface-2)}
  .btn{transition:background .14s,border-color .14s}
  .btn:hover{background:var(--surface-2)}
  .btn.primary:hover{background:#ab2a50;border-color:#ab2a50}
  .btn.ghost:hover{background:#fdf1ef}
  .pickbtn{transition:background .14s,border-color .14s}
  .pickbtn:hover{background:var(--surface-2)}
  .pickbtn.primary:hover{background:#fbdfe9;border-color:rgba(194,51,92,.45)}
  .chip-sel{transition:background .14s,border-color .14s}
  .chip-sel:hover{background:var(--surface-2)}
  .chip-sel[aria-pressed="true"]:hover{background:var(--soft,var(--accent-soft))}
  .star .sb{transition:color .12s}
  .star:hover .sb{color:#e0cfd6}

  /* 사진 끌어다 놓기 */
  .pdrop{height:118px;transition:border-color .14s,background .14s,color .14s}
  .pdrop:hover{border-color:#dcc3cd;background:#f9f3f6;color:var(--text-2)}
  .pdrophint{display:block;margin-top:1px;font-size:11px;font-weight:600;color:var(--text-3)}
  #photoBox.dragging .pdrop{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}

  /* FAB 대신 헤더 버튼, 토스트는 화면 아래 가운데 */
  .fab{display:none}
  #toast{bottom:34px;max-width:420px}
}

/* 카드 두 칸이 제대로 들어가는 폭부터 2열 */
@media (min-width:1000px){
  .mgroup{grid-template-columns:repeat(2,minmax(0,1fr))}
}

</style>
</head>
<body>
<div id="root">
  <header class="appbar" id="appbar"></header>
  <main id="view" role="main"></main>
  <div id="fabhost"></div>
</div>
<div id="sheetroot"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
/* SCMJ 주록 — 와인·술 기록장 (single file build target: src/app.js)
 * 광고·추적·외부 CDN 없음. 사진은 기기(IndexedDB)에, 남편과는 방 코드로 실시간 공유. */
(function () {
  'use strict';

  /* ------------------------------------------------------------------ *
   *  상수
   * ------------------------------------------------------------------ */
  var APP_VER = '1.2.0';
  var KEY_META = 'drink_log_meta_v1';
  var KEY_ROOM = 'drink_log_sync_room_v1';
  var KEY_SYNC = 'drink_log_sync_meta_v1';
  var KEY_DRAFT = 'drink_log_draft_v1';
  var DB_NAME = 'drink_log_db';
  var DB_VER = 2;   /* v2: drafts 저장소 — 임시 저장 사진이 localStorage 에 안 들어갈 때 */
  var DRAFT_DEBOUNCE = 200;
  var STATE_V = 3;

  /* 사진: 남편 폰과 Firebase 로 주고받으므로 작게 — 긴 변 800px, JPEG 0.72, 250KB 넘으면 더 줄인다 */
  var MAXDIM = 800;
  var QUALITY = 0.72;
  var PHOTO_CAP = 250 * 1024;

  /* 배포본에서는 false 로 바뀐다 (deploy/build_deploy.py) */
  var WITH_SAMPLE = false; /* @sample */

  var CATS = [
    { key: 'red', label: '레드 와인', short: '레드', emoji: '🍷', color: '#b3273b', soft: '#fbe9ec', ink: '#8e1d2e' },
    { key: 'white', label: '화이트 와인', short: '화이트', emoji: '🥂', color: '#8fa62b', soft: '#f3f8e1', ink: '#66791a' },
    { key: 'sparkling', label: '스파클링', short: '스파클링', emoji: '🍾', color: '#c9a227', soft: '#fbf3d9', ink: '#8f7209' },

    r.place = String(raw.place || '').trim().slice(0, 60);

        tx.onabort = function () { resolve(null); };
      });
    });

    return openDb().then(function (db) {

      return new Promise(function (resolve) {

        catch (e) { resolve(false); return; }
        var rs = tx.objectStore('records');

  function renderHero(list) {
    var s = summary(list);

    return '<section class="hero">' +
      '<div class="hlabel"><span>' + (filtering ? '고른 기록' : '내 주록') + '</span><span class="hbadge">' + badge + '</span></div>' +
      '<div class="hcount">' + s.count + '<small>병</small></div>' +
      '<div class="hsub">' + esc(sub) + '</div>' +
      '<div class="hstats">' +
        '<div><b>' + (s.avg == null ? '—' : '★ ' + fmtRating(s.avg)) + '</b><small>평균 별점</small></div>' +
        '<div><b>' + (s.top ? s.top.cat.emoji + ' ' + s.top.cat.short : '—') + '</b><small>제일 많이</small></div>' +

    return '<div class="tabs" role="tablist" aria-label="화면 전환">' +
      '<button type="button" role="tab" data-act="setTab" data-tab="list" aria-selected="' + (ui.tab === 'list') + '">내역</button>' +
      '<button type="button" role="tab" data-act="setTab" data-tab="photos" aria-selected="' + (ui.tab === 'photos') + '">사진</button>' +
      '<button type="button" role="tab" data-act="setTab" data-tab="stats" aria-selected="' + (ui.tab === 'stats') + '">통계</button>' +

  function cardHtml(r) {
    var c = catOf(r.cat);
    var thumb = r.photo
      ? '<img src="' + esc(r.photo) + '" alt="" loading="lazy">'

      ? '<span class="ragain ' + (r.again === 'no' ? 'no' : '') + '">' + (r.again === 'yes' ? '또 마실래요' : '한 번으로') + '</span>'

      '<div class="rmain">' +
        '<div class="rline1"><span class="rname">' + esc(r.name) + '</span>' +
          '<span class="rrate' + (r.rating ? '' : ' none') + '">' + starText(r.rating) + '</span></div>' +
        '<div class="rline2"><span class="rcat" style="--soft:' + c.soft + ';--ink:' + c.ink + '">' + c.emoji + ' ' + c.label + '</span>' +

  /* ------------------------------------------------------------------ *
   *  렌더 본체
   * ------------------------------------------------------------------ */
  function renderBody() {
    var view = el('view');
    if (!view) return;
    var top = view.scrollTop;
    var list = filtered();
    var body = '';
    if (!canStore) {
      body += '<div class="notice"><span>이 화면에서는 자동 저장을 쓸 수 없어요. 기록을 꼭 백업해 두세요.</span></div>';
    }
    body += '<div class="pcshell"><div class="pcside">' + renderHero(list) + renderTabs() + '</div>' +
      '<div class="pcmain">' + draftBannerHtml() +
        (ui.tab === 'stats' ? renderStats() : (ui.tab === 'photos' ? renderPhotos(list) : renderList(list))) +
      '</div></div>';
    view.innerHTML = body;
    el('fabhost').innerHTML = '<button type="button" class="fab" data-act="newRecord" aria-label="기록 추가">' + ICONS.plus + '기록</button>';
    view.scrollTop = top;
  }

  function render() {
    var ab = el('appbar');
    if (ab) ab.innerHTML = renderAppbar();
    renderBody();
    document.body.classList.toggle('sheet-open', !!sheet);
    renderSheet();
  }

  function renderTop() {
    render();
    var v = el('view');
    if (v) v.scrollTop = 0;

  /* ------------------------------------------------------------------ *
   *  시트 공통
   * ------------------------------------------------------------------ */
  function openSheet(s) { sheet = s; render(); }
  /* 닫기 — 기록 시트면 작성 중인 내용을 먼저 임시 저장에 남긴다 (skipDraft: 저장 직후처럼 남길 필요 없을 때) */
  function closeSheet(skipDraft) {
    if (!skipDraft && sheet && sheet.type === 'record') draftFlush();
    sheet = null;
    draftRestoreToken++;
    render();
  }

  function sheetWrap(title, bodyHtml, footHtml, extraCls, headHtml) {
    return '<div class="scrim" data-act="closeSheet"></div>' +
      '<section class="sheet ' + (extraCls || '') + '" role="dialog" aria-modal="true" aria-label="' + esc(title) + '">' +
      '<div class="sheet-head"><div class="grab"></div><h2>' + esc(title) + (headHtml || '') + '</h2>' +
      '<button type="button" class="act" data-act="closeSheet" aria-label="닫기">' + ICONS.close + '</button></div>' +
      '<div class="sheet-body">' + bodyHtml + '</div>' +
      (footHtml ? '<div class="sheet-foot">' + footHtml + '</div>' : '') +
      '</section>';
  }

  function renderSheet() {
    var host = el('sheetroot');
    if (!host) return;
    if (!sheet) { host.innerHTML = ''; return; }
    var html = '';
    if (sheet.type === 'record') html = sheetRecord();
    else if (sheet.type === 'detail') html = sheetDetail();
    else if (sheet.type === 'more') html = sheetMore();
    else if (sheet.type === 'sync') html = sheetSync();
    else if (sheet.type === 'confirm') html = sheetConfirm();
    else if (sheet.type === 'exportText') html = sheetExportText();
    host.innerHTML = html;
    var form = el('recordForm');
    if (form) updateFoot();
    if (sheet && sheet.focus) {
      var f = form && form.querySelector('[name="' + sheet.focus + '"]');
      if (f) { try { f.focus(); f.setSelectionRange(f.value.length, f.value.length); } catch (e) { } }
    }
  }

  /* ------------------------------------------------------------------ *
   *  별점 UI
   * ------------------------------------------------------------------ */
  function starsHtml(rating) {
    var h = '<div class="starin" id="starIn">';
    for (var i = 1; i <= 5; i++) {
      var fill = rating >= i ? 100 : (rating >= i - 0.5 ? 50 : 0);
      h += '<span class="star">' +
        '<span class="sb">★</span><span class="sf" style="width:' + fill + '%">★</span>' +
        '<button type="button" class="sh l" data-star="' + (i - 0.5) + '" aria-label="' + (i - 0.5) + '점"></button>' +
        '<button type="button" class="sh r" data-star="' + i + '" aria-label="' + i + '점"></button>' +
        '</span>';
    }
    h += '<b class="rnum' + (rating ? '' : ' none') + '" id="starNum">' + (rating ? '★ ' + fmtRating(rating) : '별점 없음') + '</b>';
    h += '<button type="button" class="rclear" data-act="clearRating">지우기</button>';
    h += '</div>';
    return h;
  }

  function paintStars(rating) {
    var wrap = el('starIn');
    if (!wrap) return;
    var stars = wrap.querySelectorAll('.star');
    Array.prototype.forEach.call(stars, function (st, idx) {
      var i = idx + 1;
      var fill = rating >= i ? 100 : (rating >= i - 0.5 ? 50 : 0);
      var sf = st.querySelector('.sf');
      if (sf) sf.style.width = fill + '%';
      Array.prototype.forEach.call(st.querySelectorAll('.sh'), function (b) {
        b.setAttribute('aria-pressed', String(Number(b.dataset.star) === rating));
      });
    });
    var num = el('starNum');
    if (num) {
      num.textContent = rating ? '★ ' + fmtRating(rating) : '별점 없음';
      num.className = 'rnum' + (rating ? '' : ' none');
    }
    updateFoot();
  }

  function setRating(v) {
    if (!sheet || !sheet.draft) return;
    sheet.draft.rating = normRating(v);
    paintStars(sheet.draft.rating);
    draftTouchNow();
  }

  /* ------------------------------------------------------------------ *
   *  사진
   * ------------------------------------------------------------------ */
  function photoBoxHtml() {
    if (!sheet || !sheet.draft) return '';
    var d = sheet.draft;
    if (d.photo) {
      var bytes = dataBytes(d.photo);
      var info = d.photoInfo;
      return '<div class="pprev"><img id="photoPrev" src="' + esc(d.photo) + '" alt="첨부한 사진">' +
        '<div class="pbtns"><button type="button" class="pbtn" data-act="pickPhoto">바꾸기</button>' +
        '<button type="button" class="pbtn" data-act="removePhoto">지우기</button></div></div>' +
        '<p class="pinfo" id="photoInfo">' + (info && info.w ? info.w + '×' + info.h + ' · ' : '') + bytesText(bytes) +
        ' · 남편과 연동해도 이 정도면 금방 보내요</p>';
    }
    return '<div class="pdrop">' + ICONS.camera + '<span>사진을 붙이면 목록에 병 사진이 보여요</span>' +
      '<span class="pdrophint">여기로 사진을 끌어다 놓아도 돼요</span></div>';
  }

  function paintPhotoBox() {
    var box = el('photoBox');
    if (box) box.innerHTML = photoBoxHtml();
    updateFoot();
  }

  function attachPhotoFile(file) {
    if (!file || !sheet || sheet.type !== 'record' || !sheet.draft) return false;
    if (String(file.type || '').indexOf('image/') !== 0) { toast('사진 파일을 골라 주세요'); return false; }
    var token = (sheet.draft.photoToken = (sheet.draft.photoToken || 0) + 1);
    toast('사진을 줄이는 중…');
    compressPhoto(file).then(function (info) {
      if (!sheet || !sheet.draft || sheet.draft.photoToken !== token) return;
      if (!info || !info.data) { toast('사진을 읽지 못했어요'); return; }
      sheet.draft.photo = info.data;
      sheet.draft.photoInfo = info;
      paintPhotoBox();
      draftTouchNow();
      if (info.bytes > PHOTO_CAP) toast('사진이 커서 ' + bytesText(info.bytes) + '로 저장돼요');
      else toast('사진 붙였어요 · ' + bytesText(info.bytes));
    });
    return true;
  }

  /* 사진 줄이기 — 긴 변 MAXDIM, JPEG QUALITY. 250KB 를 넘으면 한 단계씩 더 줄인다. */
  function compressPhoto(file) {
    return new Promise(function (resolve) {
      if (!file) { resolve(null); return; }
      var fr = new FileReader();
      fr.onerror = function () { resolve(null); };
      fr.onload = function () {
        var raw = String(fr.result || '');
        if (typeof Image === 'undefined' || !document.createElement) { resolve({ data: raw, w: 0, h: 0, bytes: dataBytes(raw) }); return; }
        var img = new Image();
        var settled = false;
        var done = function (v) { if (settled) return; settled = true; resolve(v); };
        /* 이미지를 못 읽는 환경(테스트 등)에서도 사진을 잃지 않게 — 원본 그대로 쓴다 */
        setTimeout(function () { done({ data: raw, w: 0, h: 0, bytes: dataBytes(raw) }); }, 2500);
        img.onerror = function () { done({ data: raw, w: 0, h: 0, bytes: dataBytes(raw) }); };
        img.onload = function () {
          var w0 = img.naturalWidth || img.width || 0;
          var h0 = img.naturalHeight || img.height || 0;
          function draw(dim, q) {
            var cv = document.createElement('canvas');
            var scale = Math.min(1, dim / Math.max(w0, h0));
            var cw = Math.max(1, Math.round(w0 * scale));
            var ch = Math.max(1, Math.round(h0 * scale));
            cv.width = cw; cv.height = ch;
            var cx = cv.getContext && cv.getContext('2d');
            if (!cx) return null;
            cx.drawImage(img, 0, 0, cw, ch);
            var out = '';
            try { out = cv.toDataURL('image/jpeg', q); } catch (e) { return null; }
            if (!out || out.slice(0, 11) !== 'data:image/') return null;
            return { data: out, w: cw, h: ch, bytes: dataBytes(out) };
          }
          var tries = [[MAXDIM, QUALITY], [MAXDIM, 0.6], [640, 0.55], [520, 0.5]];
          var best = null;
          for (var i = 0; i < tries.length; i++) {
            var got = draw(tries[i][0], tries[i][1]);
            if (!got) continue;
            if (!best || got.bytes < best.bytes) best = got;
            if (got.bytes <= PHOTO_CAP) { best = got; break; }
          }
          if (!best) { done({ data: raw, w: w0, h: h0, bytes: dataBytes(raw) }); return; }
          done(best);
        };
        img.src = raw;
      };
      fr.readAsDataURL(file);
    });
  }

  /* ------------------------------------------------------------------ *
   *  임시 저장 — 작성 중인 글을 이 기기에만 남긴다.
   *  · 글자·메타는 localStorage(KEY_DRAFT), 사진이 커서 안 들어가면 IndexedDB(drafts)
   *  · 저장/수정 저장을 누르기 전에는 목록(state.records)·통계·남편 방(Firebase)에 안 올라간다.
   * ------------------------------------------------------------------ */
  var draftTimer = null;
  var draftPhotoInIdb = false;
  var draftRestoreToken = 0;

  function draftFieldsOf(src) {
    var r = src || {};
    return {
      name: String(r.name == null ? '' : r.name).slice(0, 80),
      cat: CATMAP[r.cat] ? r.cat : 'red',
      rating: normRating(r.rating),
      date: isDateKey(r.date) ? String(r.date) : todayKey(),
      memo: String(r.memo == null ? '' : r.memo).slice(0, 1000),
      place: String(r.place == null ? '' : r.place).slice(0, 60),
      price: Math.max(0, int(r.price)),
      again: (r.again === 'yes' || r.again === 'no') ? r.again : '',
      photo: (typeof r.photo === 'string' && r.photo.slice(0, 11) === 'data:image/') ? r.photo : ''
    };
  }

  /* 원래 기록(또는 빈 폼)과 달라진 게 있을 때만 임시 저장을 남긴다 */
  function draftMeaningful(d, recId) {
    var base = recId ? byId(recId) : null;
    var b = draftFieldsOf(base || {});
    var keys = ['name', 'cat', 'rating', 'date', 'memo', 'place', 'price', 'again', 'photo'];
    for (var i = 0; i < keys.length; i++) {
      var k = keys[i];
      if (k === 'rating' || k === 'price') {
        if (Number(d[k]) !== Number(b[k])) return true;
      } else if (String(d[k] == null ? '' : d[k]) !== String(b[k] == null ? '' : b[k])) {
        return true;
      }
    }
    return false;
  }

  /* 읽기 — 없거나 원본 기록이 사라진 수정 임시 저장이면 null */
  function draftPeek() {
    if (!canStore) return null;
    var raw = '';
    try { raw = window.localStorage.getItem(KEY_DRAFT); } catch (e) { return null; }
    if (!raw) return null;
    var o;
    try { o = JSON.parse(raw); } catch (e) { return null; }
    if (!o || !o.draft || typeof o.draft !== 'object') return null;
    var kind = o.kind === 'edit' ? 'edit' : 'new';
    var recId = kind === 'edit' ? String(o.recId || '').slice(0, 80) : '';
    if (kind === 'edit' && (!recId || !byId(recId))) return null;
    var d = draftFieldsOf(o.draft);
    d.photoInfo = null;
    return {
      kind: kind, recId: recId, draft: d, savedAt: Number(o.savedAt) || 0,
      photoInIdb: !!o.photoInIdb && !d.photo
    };
  }

  /* 쓰기 — 사진까지 localStorage 에 넣어 보고, 용량이 모자라면 글자만이라도 남긴다 */
  function draftWrite(kind, recId, d) {
    if (!canStore) return false;
    var payload = {
      v: 1, kind: kind === 'edit' ? 'edit' : 'new', recId: kind === 'edit' ? String(recId || '') : '',
      savedAt: Date.now(), draft: draftFieldsOf(d)
    };
    try {
      window.localStorage.setItem(KEY_DRAFT, JSON.stringify(payload));
      if (draftPhotoInIdb) draftPhotoDrop();
      return true;
    } catch (e) { }
    var light = draftFieldsOf(d);
    var hasPhoto = !!light.photo;
    light.photo = '';
    payload.draft = light;
    payload.photoInIdb = hasPhoto;
    try { window.localStorage.setItem(KEY_DRAFT, JSON.stringify(payload)); }
    catch (e2) { return false; }
    if (hasPhoto) draftKeepPhoto(d.photo);
    else if (draftPhotoInIdb) draftPhotoDrop();
    return true;
  }

  function draftClear() {
    if (draftTimer) { clearTimeout(draftTimer); draftTimer = null; }
    try { if (canStore) window.localStorage.removeItem(KEY_DRAFT); } catch (e) { }
    if (draftPhotoInIdb) draftPhotoDrop();
    var st = el('draftStat');
    if (st) { st.textContent = ''; st.className = 'dstat'; }
  }

  /* 폼에 적힌 값(이름·날짜·메모·구매처·가격)을 임시 저장본으로 옮긴다. 칩·별점·사진은 이미 draft 에 있다. */
  function draftSyncForm() {
    if (!sheet || sheet.type !== 'record' || !sheet.draft) return;
    var form = el('recordForm');
    if (!form) return;
    var g = function (n) { var x = form.querySelector('[name="' + n + '"]'); return x ? x.value : ''; };
    var d = sheet.draft;
    d.name = String(g('name')).slice(0, 80);
    var dt = g('date');
    if (isDateKey(dt)) d.date = dt;
    d.memo = String(g('memo')).slice(0, 1000);
    d.place = String(g('place')).slice(0, 60);
    d.price = Math.max(0, int(g('price')));
  }

  function draftCommit() {
    if (!sheet || sheet.type !== 'record' || !sheet.draft) return false;
    var d = sheet.draft;
    var st = el('draftStat');
    if (!draftMeaningful(d, sheet.recId)) {
      draftClear();
      return false;
    }
    var ok = draftWrite(sheet.recId ? 'edit' : 'new', sheet.recId, d);
    if (st) {
      st.textContent = ok ? '자동 임시 저장됨' : '임시 저장 못 함';
      st.className = ok ? 'dstat on' : 'dstat warn';
    }
    return ok;
  }

  function draftQueue() {
    if (draftTimer) clearTimeout(draftTimer);
    draftTimer = setTimeout(function () { draftTimer = null; draftCommit(); }, DRAFT_DEBOUNCE);
  }

  /* 타이핑 — 잠깐 모았다가 저장 */
  function draftTouch() { draftSyncForm(); draftQueue(); }
  /* 칩·별점·사진 — 바로 저장 */
  function draftTouchNow() {
    if (draftTimer) { clearTimeout(draftTimer); draftTimer = null; }
    draftSyncForm();
    draftCommit();
  }
  /* 닫기·새로 고침·앱 전환 직전 */
  function draftFlush() {
    if (!sheet || sheet.type !== 'record' || !sheet.draft) return;
    if (draftTimer) { clearTimeout(draftTimer); draftTimer = null; }
    draftSyncForm();
    draftCommit();
  }

  function draftPhotoTx(mode, fn) {
    if (!HAS_IDB) return Promise.resolve(null);
    return openDb().then(function (db) {
      if (!db) return null;
      return new Promise(function (resolve) {
        var tx;
        try { tx = db.transaction('drafts', mode); } catch (e) { HS_IDB_OFF(); resolve(null); return; }
        var out = null;
        var req = null;
        try { req = fn(tx.objectStore('drafts')); } catch (e2) { resolve(null); return; }
        if (req) req.onsuccess = function () { out = req.result; };
        tx.oncomplete = function () { resolve(out); };
        tx.onerror = function () { resolve(null); };
        tx.onabort = function () { resolve(null); };
      });
    }, function () { return null; });
  }
  function draftKeepPhoto(data) {
    draftPhotoInIdb = true;
    draftPhotoTx('readwrite', function (st) { return st.put({ id: 'draft', data: data, savedAt: Date.now() }); });
  }
  function draftPhotoDrop() {
    draftPhotoInIdb = false;
    draftPhotoTx('readwrite', function (st) { return st.delete('draft'); });
  }
  function draftPhotoLoad() {
    return draftPhotoTx('readonly', function (st) { return st.get('draft'); }).then(function (row) {
      return row && typeof row.data === 'string' ? row.data : '';
    });
  }
  /* 사진만 IndexedDB 에 있던 임시 저장 — 시트를 연 뒤 도착하면 미리보기에 채운다 */
  function draftPhotoRestore() {
    var token = ++draftRestoreToken;
    draftPhotoLoad().then(function (data) {
      if (token !== draftRestoreToken) return;
      if (!data) return;
      if (!sheet || sheet.type !== 'record' || !sheet.draft || !sheet.fromDraft) return;
      sheet.draft.photo = data;
      sheet.draft.photoInfo = { w: 0, h: 0, bytes: dataBytes(data) };
      paintPhotoBox();
      updateFoot();
    });
  }

  /* 새 기록 / 수정 시트 열기 — 같은 종류의 임시 저장이 있으면 그 내용을 불러온다 */
  function openRecordSheet(recId) {
    var id = recId ? String(recId) : '';
    var rec = id ? byId(id) : null;
    if (id && !rec) return;
    var found = draftPeek();
    if (found && ((found.kind === 'new' && !id) || (found.kind === 'edit' && found.recId === id))) {
      var d = found.draft;
      if (found.photoInIdb) { draftPhotoInIdb = true; d.photo = ''; }
      openSheet({ type: 'record', recId: id, draft: d, fromDraft: true });
      if (found.photoInIdb) draftPhotoRestore();
      return;
    }
    openSheet({ type: 'record', recId: id, draft: recordDraft(rec), fromDraft: false });
  }

  /* 메인 화면 — 작성 중인 새 기록 임시 저장이 있으면 이어 쓰기 배너 */
  function draftBannerHtml() {
    if (sheet) return '';
    var found = draftPeek();
    if (!found || found.kind !== 'new') return '';
    var nm = found.draft.name ? ' 「' + esc(found.draft.name) + '」' : '';
    return '<button type="button" class="draftbar" data-act="resumeDraft" aria-label="작성 중인 임시 저장 이어 쓰기">' +
      '<span class="dbi">' + ICONS.pencil + '</span>' +
      '<span class="dbt">작성 중인 임시 저장 있음' + nm + '</span>' +
      '<span class="dba">이어 쓰기</span></button>';
  }

  /* ------------------------------------------------------------------ *
   *  기록 추가/수정 시트
   * ------------------------------------------------------------------ */
  function recordDraft(r) {
    if (r) {
      return {
        id: r.id, name: r.name, cat: r.cat, rating: normRating(r.rating), date: r.date,
        memo: r.memo, place: r.place, price: r.price, again: r.again, photo: r.photo, photoInfo: null
      };
    }
    return {
      id: '', name: '', cat: 'red', rating: 0, date: todayKey(),
      memo: '', place: '', price: 0, again: '', photo: '', photoInfo: null
    };
  }

  function sheetRecord() {
    var d = sheet.draft;
    var editing = !!sheet.recId;
    var h = '<form id="recordForm" data-form="recordForm" autocomplete="off">';

    /* 임시 저장에서 불러온 글 — 안내 + 새로 쓰기 / 원래대로 */
    if (sheet.fromDraft) {
      h += '<div class="dnote" id="draftNote"><span>' +
        (editing ? '수정 중이던 임시 저장을 불러왔어요' : '임시 저장된 글을 불러왔어요') + '</span>' +
        '<button type="button" class="dlink" data-act="' + (editing ? 'revertDraft' : 'discardDraft') + '">' +
        (editing ? '원래대로' : '새로 쓰기') + '</button></div>';
    }

    h += '<label class="lbl" for="fName">술 이름</label>' +
      '<input id="fName" class="field" name="name" value="' + esc(d.name) + '" maxlength="80" placeholder="예: 와인 이름" aria-label="술 이름">';

    h += '<span class="lbl">종류</span><div class="chiprow" id="catPick">' +
      CATS.map(function (c) {
        return '<button type="button" class="chip-sel" data-chip="cat" data-cat="' + c.key + '"' +
          ' style="--c:' + c.color + ';--soft:' + c.soft + ';--ink:' + c.ink + '"' +
          ' aria-pressed="' + (d.cat === c.key) + '">' + c.emoji + ' ' + c.label + '</button>';
      }).join('') + '</div>';

    h += '<span class="lbl">별점 <span style="font-weight:700;letter-spacing:0">(0.5점 단위)</span></span>' + starsHtml(d.rating);

    h += '<label class="lbl" for="fDate">마신 날</label>' +
      '<input id="fDate" class="field" type="date" name="date" value="' + esc(d.date) + '" aria-label="마신 날">';

    h += '<span class="lbl">사진</span><div id="photoBox">' + photoBoxHtml() + '</div>' +
      '<div class="pickrow"><button type="button" class="pickbtn primary" data-act="pickPhoto">' + ICONS.camera + '사진 찍기 / 고르기</button></div>' +
      '<input type="file" id="photoInput" accept="image/*" hidden data-change="photo">';

    h += '<label class="lbl" for="fMemo">메모</label>' +
      '<textarea id="fMemo" class="field" name="memo" rows="3" maxlength="1000" placeholder="향·맛, 같이 마신 사람, 음식 페어링…">' + esc(d.memo) + '</textarea>';

    h += '<span class="lbl">구매처 · 가격 (선택)</span><div class="tworow">' +
      '<input class="field" name="place" value="' + esc(d.place) + '" maxlength="60" placeholder="구매처" aria-label="구매처">' +
      '<div class="inrow"><input class="field" name="price" inputmode="numeric" value="' + (d.price ? comma(d.price) : '') + '" placeholder="가격" aria-label="가격"><span class="unit">원</span></div>' +
      '</div>';

    h += '<span class="lbl">또 마실래요? (선택)</span><div class="chiprow" id="againPick">' +
      '<button type="button" class="chip-sel" data-chip="again" data-again="yes" aria-pressed="' + (d.again === 'yes') + '">👍 또 마실래요</button>' +
      '<button type="button" class="chip-sel" data-chip="again" data-again="no" aria-pressed="' + (d.again === 'no') + '">🤔 한 번으로 족함</button>' +
      '</div>';

    h += '</form>';

    var foot = '<div class="footsum" id="footSum"><span class="fsl">별점</span><b id="footRate">' +
      (d.rating ? '★ ' + fmtRating(d.rating) : '없음') + '</b><span class="fsr" id="footMeta"></span></div>' +
      '<div class="footbtns">' +
      (editing ? '<button type="button" class="btn ghost" data-act="askDelete">삭제</button>' : '') +
      '<button type="button" class="btn primary" data-act="saveRecord">' + (editing ? '수정 저장' : '저장') + '</button>' +
      '</div>';
    return sheetWrap(editing ? '기록 수정' : '새 기록', h, foot, '',
      '<span class="dstat" id="draftStat" role="status" aria-live="polite"></span>');
  }

  function updateFoot() {
    if (!sheet || sheet.type !== 'record') return;
    var d = sheet.draft;
    var rate = el('footRate');
    if (rate) rate.textContent = d.rating ? '★ ' + fmtRating(d.rating) : '없음';
    var meta = el('footMeta');
    if (meta) {
      var bits = [];
      if (d.photo) bits.push('사진 ' + bytesText(dataBytes(d.photo)));
      if (d.again) bits.push(AGAIN_LABEL[d.again]);
      meta.textContent = bits.join(' · ');
    }
  }

  function activeChip(form, group) {
    var b = form.querySelector('[data-chip="' + group + '"][aria-pressed="true"]');
    if (!b) return '';
    return b.dataset[group] || '';
  }

  function readForm(form) {
    var f = function (n) { var x = form.querySelector('[name="' + n + '"]'); return x ? x.value : ''; };
    var d = sheet && sheet.draft ? sheet.draft : recordDraft(null);
    return {
      id: d.id || '',
      name: String(f('name') || '').trim().slice(0, 80),
      cat: activeChip(form, 'cat') || d.cat || 'etc',
      rating: normRating(d.rating),
      date: isDateKey(f('date')) ? f('date') : todayKey(),
      memo: String(f('memo') || '').slice(0, 1000),
      place: String(f('place') || '').trim().slice(0, 60),
      price: Math.max(0, int(f('price'))),
      again: activeChip(form, 'again') || '',
      photo: d.photo || '',
      photoInfo: d.photoInfo || null
    };
  }

  /* ------------------------------------------------------------------ *
   *  상세 시트
   * ------------------------------------------------------------------ */
  function sheetDetail() {
    var r = byId(sheet.recId);
    if (!r) { sheet = null; return ''; }
    var c = catOf(r.cat);
    var photo = r.photo
      ? '<img class="dphoto" src="' + esc(r.photo) + '" alt="' + esc(r.name) + ' 사진">'
      : '<div class="dph" style="background:' + c.soft + '">' + c.emoji + '</div>';
    var again = r.again ? AGAIN_LABEL[r.again] : '안 적음';
    var body = photo +
      '<div class="dhead"><span class="dname">' + esc(r.name) + '</span>' +
      '<span class="drate">' + starText(r.rating) + '</span></div>' +
      '<div class="dmeta"><span class="rcat" style="--soft:' + c.soft + ';--ink:' + c.ink + '">' + c.emoji + ' ' + c.label + '</span>' +
      '<span class="rdate">' + fmtLongDate(r.date) + '</span></div>' +
      (r.memo ? '<div class="dmemo">' + esc(r.memo) + '</div>' : '') +
      '<div class="drows">' +
        '<div class="drow"><span>구매처</span><b>' + (r.place ? esc(r.place) : '—') + '</b></div>' +
        '<div class="drow"><span>가격</span><b>' + (r.price ? won(r.price) : '—') + '</b></div>' +
        '<div class="drow"><span>또 마실래요</span><b>' + again + '</b></div>' +
        (r.photo ? '<div class="drow"><span>사진</span><b>' + bytesText(dataBytes(r.photo)) + '</b></div>' : '') +
      '</div>' +
      '<p class="hint">' + (sync.key ? '연동 중 — 남편 폰에도 같이 보여요' : '이 기기에만 저장돼 있어요') + ' · ' + fmtDate(r.date) + ' 기록</p>';
    var foot = '<div class="footbtns">' +
      '<button type="button" class="btn ghost" data-act="askDelete" data-id="' + esc(r.id) + '">삭제</button>' +
      '<button type="button" class="btn primary" data-act="editRecord" data-id="' + esc(r.id) + '">수정</button>' +
      '</div>';
    return sheetWrap('기록', body, foot);
  }

  /* ------------------------------------------------------------------ *
   *  더보기 시트
   * ------------------------------------------------------------------ */
  function sheetMore() {
    var st = stats();
    var body = '<div class="menulist">' +
      '<button type="button" data-act="exportJson">' + ICONS.download + '<span>JSON 백업 내보내기 (사진 포함)</span></button>' +
      '<button type="button" data-act="importBtn">' + ICONS.upload + '<span>백업 불러오기 (복원)</span></button>' +
      '<button type="button" data-act="exportCsv">' + ICONS.table + '<span>엑셀(CSV) 내보내기</span></button>' +
      '<button type="button" data-act="openSync">' + ICONS.cloud + '<span>남편 연동' + (sync.key ? ' · ' + syncStatusText() : '') + '</span></button>' +
      (WITH_SAMPLE ? '<button type="button" data-act="restoreSample">' + ICONS.sparkle + '<span>샘플 데이터 복원</span></button>' : '') +
      '<button type="button" class="danger" data-act="resetAll">' + ICONS.trash + '<span>전체 초기화</span></button>' +
    '</div>' +
    '<input type="file" id="importFile" accept=".json,application/json" hidden data-change="importFile">' +
    '<p class="hint" style="margin-top:10px">기록 ' + st.count + '병 · 사진 ' + st.photos + '장 (' + bytesText(st.photoBytes) + ')<br>' +
      '저장: ' + (HAS_IDB ? '이 기기 IndexedDB (사진 포함)' : (canStore ? '이 브라우저 localStorage' : '자동 저장을 쓸 수 없어요')) +
      ' · ' + (sync.key ? '남편과 연동 중' : '혼자 쓰는 중') + '<br>버전 ' + APP_VER + ' · 광고 없음 · 설치하면 오프라인에서도 열려요</p>';
    return sheetWrap('더보기', body);
  }

  /* ------------------------------------------------------------------ *
   *  남편 연동 시트
   * ------------------------------------------------------------------ */
  function sheetSync() {
    var on = !!sync.key;
    var body = '<div class="syncbox" id="syncBox" data-status="' + sync.status + '">' +
      '<span class="sdot"></span><b>' + syncStatusText() + '</b>' +
      (on ? '<code>' + esc(displayRoom()) + '</code>' : '') +
      '</div>';
    if (!on) {
      body += '<p class="hint">남편과 같은 주록을 쓰려면 방을 만들어요. 코드를 아는 기기만 들어올 수 있고, 사진까지 같이 보여요.</p>' +
        '<button type="button" class="btn primary wide" data-act="createRoom">새 방 만들기</button>' +
        '<div class="lbl">방 코드로 참여하기</div>' +
        '<form data-form="joinRoom" autocomplete="off"><div class="formrow">' +
          '<input class="field" name="roomcode" placeholder="예: wine-xxxxxx" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="방 코드">' +
          '<button class="btn primary" type="submit">참여</button></div></form>' +
        '<p class="hint">방을 만들면 이 기기의 기록 ' + state.records.length + '병이 함께 올라가요.</p>';
      return sheetWrap('남편 연동', body);
    }
    body += '<div class="lbl">남편 초대 링크</div>' +

  /* ------------------------------------------------------------------ *
   *  기록 조작

  function addRecord(rec) {
    rec.id = uid();
    rec.createdAt = Date.now();
    rec.updatedAt = rec.createdAt;
    var clean = normRecord(rec);
    if (!clean) return null;
    if (state.removed[clean.id]) delete state.removed[clean.id];
    state.records.push(clean);
    persist();
    syncPushRecord(clean);
    return clean;
  }

  function updateRecord(rec) {
    var i = -1;
    state.records.forEach(function (r, idx) { if (r.id === rec.id && i < 0) i = idx; });
    if (i < 0) return null;
    rec.createdAt = state.records[i].createdAt || Date.now();
    rec.updatedAt = Date.now();
    var clean = normRecord(rec);
    if (!clean) return null;
    state.records[i] = clean;
    persist();
    syncPushRecord(clean);
    return clean;
  }

  function delRecord(id) {
    var r = byId(id);
    if (!r) return false;
    state.records = state.records.filter(function (x) { return x.id !== id; });
    state.removed[id] = Date.now();
    persist();
    syncDelRecord(id);
    return true;
  }

    var editing = !!(sheet && sheet.recId);

    draftClear();
    closeSheet(true);

  }

  function csvCell(v) {

  function csvText() {

    var lines = [head.map(csvCell).join(',')];

    }).forEach(function (r) {

  function download(text, filename, mime) {

  /* ------------------------------------------------------------------ *

   *  방 코드를 아는 기기끼리만 같은 주록을 실시간으로 봅니다.
   *  기록은 /rooms/{방}/drinks/{id} 에 한 병씩 — 사진까지 있어도 한 병만 오가요.
   * ------------------------------------------------------------------ */
  var DB_URL = 'https://scmj-7f5e5-default-rtdb.asia-southeast1.firebasedatabase.app';
  var INVITE_BASE = 'https://minjeong9393.github.io/drink-log/';

  var sync = {
    room: '', key: '', status: 'off', stream: 'idle', es: null,
    timer: null, retry: 0, pending: 0, error: ''

  function lsGet(k) { try { return window.localStorage.getItem(k) || ''; } catch (e) { return ''; } }

    catch (e) { return false; }

  function syncMetaGet() {
    var m = null;
    try { m = JSON.parse(lsGet(KEY_SYNC) || '{}'); } catch (e) { m = null; }
    return (m && typeof m === 'object' && !Array.isArray(m)) ? m : {};
  }

    var m = syncMetaGet();
    Object.keys(patch || {}).forEach(function (k) { m[k] = patch[k]; });
    lsSet(KEY_SYNC, JSON.stringify(m));
  }

  function utf8Hex(s) {
    var enc = '';
    try { enc = encodeURIComponent(String(s)); } catch (e) { return ''; }
    var out = '', i = 0;
    while (i < enc.length) {
      var ch = enc.charAt(i);

      else { out += ('0' + enc.charCodeAt(i).toString(16)).slice(-2); i += 1; }

  function utf8FromHex(h) {
    var s = '';
    for (var i = 0; i < h.length; i += 2) s += '%' + h.substr(i, 2);
    try { return decodeURIComponent(s); } catch (e) { return h; }
  }
  function encodeRoomKey(raw) {
    var code = String(raw == null ? '' : raw).trim();
    if (!code) return '';
    if (/^[A-Za-z0-9_-]{1,64}$/.test(code)) return code.toLowerCase();
    return 'u-' + utf8Hex(code).slice(0, 360);
  }
  function decodeRoomKey(key) {
    var k = String(key || '');
    return k.indexOf('u-') === 0 ? utf8FromHex(k.slice(2)) : k;
  }
  function randCode(n) {
    var chars = 'abcdefghjkmnpqrstuvwxyz23456789';
    var buf = null;
    try { if (window.crypto && window.crypto.getRandomValues) { buf = new Uint32Array(n); window.crypto.getRandomValues(buf); } } catch (e) { buf = null; }
