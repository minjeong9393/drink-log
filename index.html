    for (var i = 0; i < n; i++) out += chars.charAt((buf ? buf[i] : Math.floor(Math.random() * 4294967296)) % chars.length);
    return out;
  }
  function displayRoom() { return sync.room || (sync.key ? decodeRoomKey(sync.key) : ''); }

  function computeStatus() {
    if (!sync.key) return 'off';
    if (sync.pending > 0) return 'sync';
    if (sync.error) return 'offline';
    if (sync.stream === 'open') return 'live';
    if (sync.stream === 'down') return 'offline';
    return 'connecting';
  }

  function refreshSyncStatus() {
    sync.status = computeStatus();
    var pill = el('syncpill');
    if (pill) {
      pill.setAttribute('data-status', sync.status);
      pill.setAttribute('aria-label', '남편 연동 — ' + syncStatusText());
      var lb = pill.querySelector('.lbl2');
      if (lb) lb.textContent = syncStatusText();
    }
    var box = el('syncBox');
    if (box) {
      box.setAttribute('data-status', sync.status);
      var b = box.querySelector('b');
      if (b) b.textContent = syncStatusText();
    }
  }

  function inviteLink() {
    var base = INVITE_BASE;
    try {
      if ((window.location.protocol === 'http:' || window.location.protocol === 'https:') && window.location.origin) {
        base = window.location.origin + window.location.pathname;
      }
    } catch (e) { }
    if (base.charAt(base.length - 1) !== '/') base += '/';
    return base + '#room=' + encodeURIComponent(sync.key);
  }

  function dbFetch(path, opts) {
    if (typeof window.fetch !== 'function') return Promise.reject(new Error('no fetch'));
    return window.fetch(DB_URL + path, opts).then(function (res) {
      if (!res || res.ok === false) {
        var err = new Error('HTTP ' + (res && res.status ? res.status : '?'));
        err.status = res && res.status ? res.status : 0;
        throw err;
      }
      return res.text();
    }).then(function (txt) {
      if (!txt) return null;
      try { return JSON.parse(txt); } catch (e) { return null; }
    });
  }
  function dbGet(path) { return dbFetch(path, { method: 'GET', cache: 'no-store' }); }
  function dbPut(path, value) {
    return dbFetch(path, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(value) });
  }
  function dbDel(path) { return dbFetch(path, { method: 'DELETE' }); }

  /* 서버로 보내는 모양 — 사진은 담고, 화면 전용 정보(photoInfo)는 뺀다 */
  function syncRecordOf(r) {
    return {
      id: r.id, name: r.name, cat: r.cat, rating: r.rating, date: r.date,
      memo: r.memo, place: r.place, price: r.price, again: r.again,
      photo: r.photo || '', createdAt: r.createdAt, updatedAt: r.updatedAt
    };
  }
  function remoteRecords(raw) {
    var out = [];
    if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return out;
    Object.keys(raw).forEach(function (k) {
      var r = normRecord(raw[k]);
      if (r) { if (!raw[k].id) r.id = String(k); out.push(r); }
    });
    return out;
  }
  function remoteRemoved(raw) { return normRemoved(raw); }

  function withPending(fn) {
    sync.pending++;
    refreshSyncStatus();
    var p;
    try { p = fn(); } catch (e) { p = Promise.reject(e); }
    return Promise.resolve(p).then(function (v) {
      sync.pending = Math.max(0, sync.pending - 1);
      refreshSyncStatus();
      return v;
    }, function (e) {
      sync.pending = Math.max(0, sync.pending - 1);
      refreshSyncStatus();
      throw e;
    });
  }

  function busyTyping() {
    var a = document.activeElement;
    if (!a || !a.tagName) return false;
    var tag = String(a.tagName).toLowerCase();
    if (tag !== 'input' && tag !== 'textarea') return false;
    return !!(a.closest && a.closest('.sheet'));
  }
  function safeRender() { if (!busyTyping()) render(); }

  function syncFail(err) {
    sync.error = (err && err.status) ? ('HTTP ' + err.status) : String((err && err.message) || 'error');
    sync.stream = sync.stream === 'open' ? 'open' : 'down';
    refreshSyncStatus();
    if (sync.key) scheduleReconnect(sync.key);
  }

  /* 한 병만 보내기/지우기 — 다른 병 기록은 건드리지 않는다 */
  function syncPushRecord(r) {
    if (!sync.key || applyingRemote || !r) return Promise.resolve(false);
    var key = sync.key;
    var id = String(r.id);
    var hadTomb = state.removed[id];
    if (hadTomb) delete state.removed[id];
    var body = syncRecordOf(r);
    return withPending(function () {
      return dbPut('/rooms/' + key + '/drinks/' + id + '.json', body).then(function () {
        if (hadTomb) return dbDel('/rooms/' + key + '/removed/' + id + '.json');
        return null;
      }).then(function () {
        return dbPut('/rooms/' + key + '/updatedAt.json', Date.now());
      });
    }).then(function () {
      sync.error = '';
      syncMetaSet({ lastPushAt: Date.now(), lastSync: Date.now() });
      refreshSyncStatus();
      return true;
    }, function (err) { syncFail(err); return false; });
  }

  function syncDelRecord(id) {
    if (!sync.key || applyingRemote) return Promise.resolve(false);
    var key = sync.key;
    var ts = state.removed[id] || Date.now();
    return withPending(function () {
      return dbDel('/rooms/' + key + '/drinks/' + id + '.json').then(function () {
        return dbPut('/rooms/' + key + '/removed/' + id + '.json', ts);
      }).then(function () {
        return dbPut('/rooms/' + key + '/updatedAt.json', Date.now());
      });
    }).then(function () {
      sync.error = '';
      syncMetaSet({ lastPushAt: Date.now(), lastSync: Date.now() });
      refreshSyncStatus();
      return true;
    }, function (err) { syncFail(err); return false; });
  }

  /* 방 만들기·불러오기처럼 여러 병을 한 번에 올릴 때 (사진 포함) */
  function syncPushAll() {
    if (!sync.key || applyingRemote) return Promise.resolve(false);
    var key = sync.key;
    var map = {};
    state.records.forEach(function (r) { map[r.id] = syncRecordOf(r); });
    var removed = state.removed || {};
    var hasRemoved = Object.keys(removed).length > 0;
    return withPending(function () {
      var p = state.records.length ? dbPut('/rooms/' + key + '/drinks.json', map) : dbDel('/rooms/' + key + '/drinks.json');
      return p.then(function () {
        return hasRemoved ? dbPut('/rooms/' + key + '/removed.json', removed) : dbDel('/rooms/' + key + '/removed.json');
      }).then(function () {
        return dbPut('/rooms/' + key + '/updatedAt.json', Date.now());
      });
    }).then(function () {
      sync.error = '';
      syncMetaSet({ lastPushAt: Date.now(), lastSync: Date.now() });
      refreshSyncStatus();
      return true;
    }, function (err) { syncFail(err); return false; });
  }

  /* 두 기기 기록 합치기 — id 기준, 더 최근에 고친 쪽이 이긴다. 지운 기록(tombstone)은 되살리지 않는다. */
  function mergeRecords(local, remote, removed) {
    var rmap = {};
    var tombstones = removed || {};
    remote.forEach(function (r) { rmap[r.id] = r; });
    var push = [];
    local.forEach(function (l) {
      var tomb = tombstones[l.id];
      if (tomb && tomb >= (l.updatedAt || 0)) { return; } /* 이 기기 사본이 이미 지워진 것 */
      var rr = rmap[l.id];
      if (!rr) { rmap[l.id] = l; push.push(l); return; }
      if ((l.updatedAt || 0) > (rr.updatedAt || 0)) { rmap[l.id] = l; push.push(l); }
    });
    var out = [];
    Object.keys(rmap).forEach(function (id) {
      var r = rmap[id];
      var tomb = tombstones[id];
      if (tomb && tomb >= (r.updatedAt || 0)) return;
      out.push(r);
    });
    return { records: out, push: push };
  }

  function syncCloseStream() {
    if (sync.es) {
      try { sync.es.close(); } catch (e) { }
      sync.es = null;
    }
    sync.stream = 'idle';
  }
  function scheduleReconnect(key) {
    if (sync.timer || !sync.key || key !== sync.key) return;
    sync.retry = Math.min(sync.retry + 1, 6);
    var wait = Math.min(30000, 1200 * Math.pow(2, sync.retry - 1));
    sync.timer = setTimeout(function () {
      sync.timer = null;
      if (key !== sync.key) return;
      syncPull({ quiet: true });
    }, wait);
  }

  /* 방 전체를 한 스트림으로 — /drinks/{id} 추가·수정·삭제가 그 자리에서 온다 */
  function applyStreamEvent(ev) {
    var msg = null;
    try { msg = JSON.parse(ev && ev.data); } catch (e) { return; }
    if (!msg || typeof msg !== 'object') return;
    var path = String(msg.path || '/').replace(/^\/+/, '');
    var data = msg.data;
    var before = JSON.stringify([state.records, state.removed]);
    applyingRemote = true;
    try {
      if (!path) {
        var room = (data && typeof data === 'object') ? data : {};
        state.records = remoteRecords(room.drinks);
        state.removed = remoteRemoved(room.removed);
      } else if (path === 'updatedAt') {
        return;
      } else if (path.indexOf('drinks/') === 0) {
        var id = path.slice(7).split('/')[0];
        if (!id) return;
        state.records = state.records.filter(function (r) { return r.id !== id; });
        var rec = data ? normRecord(data) : null;
        if (rec) { if (!data.id) rec.id = id; state.records.push(rec); }
      } else if (path.indexOf('removed/') === 0) {
        var rid = path.slice(8).split('/')[0];
        if (!rid) return;
        var ts = Number(data) || Date.now();
        state.removed[rid] = Math.max(ts, state.removed[rid] || 0);
        state.records = state.records.filter(function (r) { return !(r.id === rid && (r.updatedAt || 0) <= ts); });
      } else {
        return;
      }
      if (JSON.stringify([state.records, state.removed]) !== before) {
        persist();
        syncMetaSet({ lastSync: Date.now() });
        safeRender();
      }
    } finally {
      applyingRemote = false;
    }
  }

  function syncStartStream() {
    syncCloseStream();
    if (!sync.key || typeof window.EventSource !== 'function') { refreshSyncStatus(); return; }
    var key = sync.key;
    var es = null;
    try {
      es = new window.EventSource(DB_URL + '/rooms/' + key + '.json');
    } catch (e) {
      sync.stream = 'down';
      refreshSyncStatus();
      scheduleReconnect(key);
      return;
    }
    sync.es = es;
    es.onopen = function () {
      if (key !== sync.key) return;
      sync.retry = 0;
      sync.stream = 'open';
      sync.error = '';
      syncMetaSet({ lastSync: Date.now() });
      refreshSyncStatus();
    };
    es.onerror = function () {
      if (key !== sync.key) return;
      sync.stream = 'down';
      refreshSyncStatus();
      syncCloseStream();
      scheduleReconnect(key);
    };
    var onEvent = function (ev) { if (key === sync.key) applyStreamEvent(ev); };
    try {
      es.addEventListener('put', onEvent);
      es.addEventListener('patch', onEvent);
    } catch (e) { }
  }

  function syncPull(opts) {
    opts = opts || {};
    if (!sync.key) return Promise.resolve(false);
    var key = sync.key;
    return withPending(function () {
      return dbGet('/rooms/' + key + '.json').then(function (raw) {
        if (key !== sync.key) return false;
        sync.error = '';
        var room = (raw && typeof raw === 'object' && !Array.isArray(raw)) ? raw : {};
        var remote = remoteRecords(room.drinks);
        var removed = remoteRemoved(room.removed);
        syncMetaSet({ lastSync: Date.now() });
        if (!remote.length && !Object.keys(removed).length) {
          if (state.records.length && (opts.join || !syncMetaGet().lastPushAt)) {
            return syncPushAll().then(function () { syncStartStream(); return true; });
          }
          syncStartStream();
          return false;
        }
        var merged = mergeRecords(state.records, remote, removed);
        state.records = merged.records;
        Object.keys(removed).forEach(function (id) {
          state.removed[id] = Math.max(removed[id], state.removed[id] || 0);

        persist();
        safeRender();
        if (merged.push.length) {
          return withPending(function () {
            return Promise.all(merged.push.map(function (r) {
              return dbPut('/rooms/' + key + '/drinks/' + r.id + '.json', syncRecordOf(r));
            })).then(function () {
              return dbPut('/rooms/' + key + '/updatedAt.json', Date.now());
            });
          }).then(function () { syncStartStream(); return true; });
        }
        syncStartStream();
        return true;
      });
    }).then(function (v) { refreshSyncStatus(); return v; }, function (err) {
      syncFail(err);
      return false;
    });
  }

  function setRoom(raw) {
    var code = String(raw == null ? '' : raw).trim();
    var key = encodeRoomKey(code);
    sync.room = code;
    sync.key = key;
    lsSet(KEY_ROOM, code);
    refreshSyncStatus();
    return key;
  }
  function syncDisconnect() {
    if (sync.timer) { clearTimeout(sync.timer); sync.timer = null; }
    syncCloseStream();
    sync.retry = 0;
    sync.room = '';
    sync.key = '';
    sync.error = '';
    lsSet(KEY_ROOM, '');
    refreshSyncStatus();
  }
  function syncConnect() {
    if (!sync.key) { refreshSyncStatus(); return; }
    sync.retry = 0;
    syncPull({ join: true });
  }
  function roomFromHash() {
    var h = '';
    try { h = String(window.location.hash || ''); } catch (e) { return ''; }
    if (h.indexOf('#room=') !== 0) return '';
    var v = h.slice(6);
    try { v = decodeURIComponent(v); } catch (e) { }
    return String(v || '').trim();
  }
  function stripHash() {
    try { window.history.replaceState(null, '', window.location.pathname + window.location.search); }
    catch (e) { try { window.location.hash = ''; } catch (e2) { } }
  }
  function bootSync() {
    var fromHash = roomFromHash();
    if (fromHash) {
      setRoom(fromHash);
      stripHash();
      syncConnect();
      toast('남편 방에 연결했어요');
      return;
    }
    var saved = lsGet(KEY_ROOM);
    if (saved) {
      setRoom(saved);
      syncPull({ quiet: true });
    }
  }

  window.addEventListener('focus', function () {
    if (sync.key && sync.status !== 'sync') syncPull({ quiet: true });
  });
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && sync.key && sync.status !== 'sync') syncPull({ quiet: true });
    if (document.hidden) draftFlush();
  });
  /* 앱을 닫거나 새로 고칠 때 — 작성 중인 글을 잃지 않게 바로 남긴다 */
  window.addEventListener('pagehide', draftFlush);
  window.addEventListener('beforeunload', draftFlush);

  /* ------------------------------------------------------------------ *
   *  동작
   * ------------------------------------------------------------------ */
  var actions = {
    setTab: function (btn) { ui.tab = btn.dataset.tab; renderTop(); },
    setCat: function (btn) { ui.cat = btn.dataset.cat; renderTop(); },
    setSort: function (btn) { ui.sort = btn.dataset.sort; renderBody(); },
    toggleRate4: function () { ui.rate4 = !ui.rate4; renderTop(); },
    clearQ: function () {
      ui.q = '';
      var inp = el('q');
      if (inp) inp.value = '';
      renderTop();
      if (inp) inp.focus();
    },
    resetFilter: function () { ui.cat = 'all'; ui.q = ''; ui.rate4 = false; renderTop(); },
    newRecord: function () {
      openRecordSheet('');
    },
    /* 헤더(PC 전용)의 새 기록 버튼 — FAB 와 같은 동작 */
    newRecordTop: function () {
      openRecordSheet('');
    },
    /* 메인 화면 배너 — 임시 저장 이어 쓰기 */
    resumeDraft: function () {
      openRecordSheet('');
    },
    /* 임시 저장된 새 글 비우고 빈 폼으로 */
    discardDraft: function () {
      if (!sheet || sheet.type !== 'record') return;
      draftClear();
      sheet.draft = recordDraft(null);
      sheet.recId = '';
      sheet.fromDraft = false;
      renderSheet();
      var f = el('fName');
      if (f) { try { f.focus(); } catch (e) { } }
      toast('새로 쓰기 — 임시 저장을 비웠어요');
    },
    /* 수정 중이던 임시 저장을 버리고 저장돼 있던 기록으로 */
    revertDraft: function () {
      if (!sheet || sheet.type !== 'record' || !sheet.recId) return;
      var r = byId(sheet.recId);
      draftClear();
      if (!r) { closeSheet(true); toast('기록을 찾지 못했어요'); return; }
      sheet.draft = recordDraft(r);
      sheet.fromDraft = false;
      renderSheet();
      toast('원래 기록으로 되돌렸어요');
    },
    saveRecord: function () { saveRecord(); },
    openDetail: function (btn) {
      var id = btn.dataset.id;
      if (!id) return;
      openSheet({ type: 'detail', recId: id });
    },
    editRecord: function (btn) {
      var id = btn.dataset.id || (sheet && sheet.recId);
      var r = id ? byId(id) : null;
      if (!r) return;
      openRecordSheet(r.id);
    },
    pickPhoto: function () {
      var f = el('photoInput');
      if (f) f.click();
    },
    removePhoto: function () {
      if (!sheet || !sheet.draft) return;
      sheet.draft.photo = '';
      sheet.draft.photoInfo = null;
      paintPhotoBox();
      draftTouchNow();
      toast('사진을 뺐어요');
    },
    clearRating: function () { setRating(0); },
    askDelete: function (btn) {
      var id = btn.dataset.id || (sheet && sheet.recId);
      var r = id ? byId(id) : null;
      if (!r) return;
      askConfirm('기록 삭제', '「' + r.name + '」 기록을 지울까요?\n연동 중이면 남편 폰에서도 함께 지워져요.', '삭제', function () {
        draftClear();
        delRecord(r.id);
        closeSheet(true);
        toast('삭제했어요');
      });
    },
    openMore: function () { openSheet({ type: 'more' }); },
    openSync: function () { openSheet({ type: 'sync' }); },
    closeSheet: function () { closeSheet(); },
    confirmYes: function () {
      var f = sheet && sheet.onYes;
      closeSheet();
      if (f) f();
    },
    createRoom: function () {
      var code = 'wine-' + randCode(6);
      setRoom(code);
      render();
      syncPull({ join: true });
      toast('방을 만들었어요');
    },
    copyInvite: function () {
      copyText(inviteLink()).then(function (ok) {
        if (ok) { toast('초대 링크를 복사했어요'); return; }
        var box = el('inviteBox');
        if (box) { try { box.focus(); box.select(); } catch (e) { } }
        toast('링크를 길게 눌러 복사해 주세요');
      });
    },
    syncNow: function () {
      if (!sync.key) return;
      syncPull({}).then(function () { toast('동기화했어요 · ' + state.records.length + '병'); });
    },
    leaveRoom: function () {
      askConfirm('연동 해제', '이 기기에서 남편 연동만 끊어요.\n기록은 그대로 남아 있어요.', '해제', function () {
        syncDisconnect();
        openSheet({ type: 'sync' });
        toast('연동을 해제했어요');
      });
    },
    exportJson: function () {
      var name = 'SCMJ주록_백업_' + todayKey() + '.json';
      if (download(jsonText(), name, 'application/json')) { closeSheet(); toast('JSON 파일로 내보냈어요 (사진 포함)'); }
      else openSheet({ type: 'exportText', title: 'JSON 백업', data: jsonText() });
    },
    exportCsv: function () {
      var name = 'SCMJ주록_' + todayKey() + '.csv';
      if (download(csvText(), name, 'text/csv;charset=utf-8')) { closeSheet(); toast('엑셀(CSV) 파일로 내보냈어요'); }
      else openSheet({ type: 'exportText', title: '엑셀(CSV) 내보내기', data: csvText() });
    },
    importBtn: function () {
      var f = el('importFile');
      if (f) f.click();
    },
    copyExport: function () {
      if (!sheet || !sheet.data) return;
      copyText(sheet.data).then(function (ok) { toast(ok ? '복사했어요' : '길게 눌러 복사해 주세요'); });
    },
    restoreSample: function () {
      askConfirm('샘플 데이터 복원', '지금 기록을 지우고 샘플 주록으로 되돌려요.\n연동 중이면 남편 폰에도 반영돼요. 먼저 백업해 두세요.', '복원', function () {
        state = seedState();
        persist();
        syncPushAll();
        draftClear();
        ui.cat = 'all'; ui.q = ''; ui.rate4 = false; ui.tab = 'list';
        closeSheet();
        toast('샘플 주록으로 되돌렸어요');
      });
    },
    resetAll: function () {
      askConfirm('전체 초기화', '모든 기록을 지워요. 되돌릴 수 없어요.\n연동 중이면 남편 폰에서도 함께 지워져요.', '모두 지우기', function () {
        state = emptyState();
        persist();
        syncPushAll();
        draftClear();
        ui.cat = 'all'; ui.q = ''; ui.rate4 = false; ui.tab = 'list';
        closeSheet();
        toast('모두 지웠어요');
      });
    }
  };

  var forms = {
    recordForm: function () { saveRecord(); },
    joinRoom: function (form) {
      var inp = form.querySelector('[name="roomcode"]');
      var v = inp ? String(inp.value || '').trim() : '';
      if (!v) { toast('방 코드를 적어 주세요'); if (inp) inp.focus(); return; }
      setRoom(v);
      render();
      syncPull({ join: true });
      toast('남편 방에 연결하는 중이에요');
    }
  };

  /* ------------------------------------------------------------------ *
   *  이벤트
   * ------------------------------------------------------------------ */
  function onChip(btn) {
    var group = btn.dataset.chip;
    var form = btn.closest ? btn.closest('form') : null;
    if (group === 'again') {
      var was = btn.getAttribute('aria-pressed') === 'true';
      var row = btn.parentNode;
      Array.prototype.forEach.call(row.querySelectorAll('[data-chip="again"]'), function (b) {
        b.setAttribute('aria-pressed', 'false');
      });
      if (!was) btn.setAttribute('aria-pressed', 'true');
      if (sheet && sheet.draft) {
        sheet.draft.again = was ? '' : btn.dataset.again;
      }
      updateFoot();
      draftTouchNow();
      return;
    }
    if (group === 'cat') {
      if (sheet && sheet.draft) sheet.draft.cat = btn.dataset.cat;
      var row2 = btn.parentNode;
      Array.prototype.forEach.call(row2.querySelectorAll('[data-chip="cat"]'), function (b) {
        b.setAttribute('aria-pressed', String(b === btn));
      });
      draftTouchNow();
      return;
    }
    if (!form) return;
    Array.prototype.forEach.call(form.querySelectorAll('[data-chip="' + group + '"]'), function (b) {
      b.setAttribute('aria-pressed', String(b === btn));
    });
  }

  document.addEventListener('click', function (e) {
    var half = e.target.closest ? e.target.closest('.sh[data-star]') : null;
    if (half) { e.preventDefault(); setRating(Number(half.dataset.star)); return; }
    var chip = e.target.closest ? e.target.closest('[data-chip]') : null;
    if (chip) { e.preventDefault(); onChip(chip); return; }
    var act = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!act) return;
    e.preventDefault();
    var fn = actions[act.dataset.act];
    if (fn) fn(act);
  });

  document.addEventListener('submit', function (e) {
    var form = e.target.closest ? e.target.closest('form[data-form]') : null;
    if (!form) return;
    e.preventDefault();
    var fn = forms[form.dataset.form];
    if (fn) fn(form);
  });

  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t && t.id === 'q') {
      ui.q = String(t.value || '');
      var box = el('searchBox');
      if (box) box.classList.toggle('hasq', !!ui.q);
      renderBody();
      return;
    }
    if (t && t.name === 'price') {
      var v = String(t.value || '').replace(/[^0-9]/g, '');
      t.value = v ? comma(Number(v)) : '';
    }
    /* 기록 시트에 적는 중 — 200ms 모았다가 임시 저장 */
    if (sheet && sheet.type === 'record' && t && t.closest && t.closest('#recordForm')) draftTouch();
  });

  document.addEventListener('change', function (e) {
    var t = e.target;
    if (!t || !t.dataset) return;
    if (t.dataset.change === 'photo') {
      var file = t.files && t.files[0];
      t.value = '';
      attachPhotoFile(file);
      return;
    }
    if (t.dataset.change === 'importFile') {
      var f = t.files && t.files[0];
      if (!f) return;
      var reader = new FileReader();
      reader.onload = function () {
        try {
          var obj = JSON.parse(String(reader.result));
          importObject(obj);
        } catch (err) {
          toast('불러오지 못했어요: ' + (err && err.message ? err.message : '형식 오류'));
        }
      };
      reader.readAsText(f);
      t.value = '';
      return;
    }
    /* 날짜 선택처럼 input 이벤트가 확실치 않은 변경도 바로 임시 저장 */
    if (sheet && sheet.type === 'record' && t.closest && t.closest('#recordForm')) draftTouchNow();
  });

  /* ------------------------------------------------------------------ *
   *  PC — 사진을 마우스로 끌어다 놓기 (파일 선택과 같은 축소 파이프라인)
   * ------------------------------------------------------------------ */
  function dropBoxOf(node) {
    if (!node || !node.closest) return null;
    if (!sheet || sheet.type !== 'record' || !sheet.draft) return null;
    return node.closest('#photoBox');
  }

  document.addEventListener('dragover', function (e) {
    if (!sheet || sheet.type !== 'record') return;
    /* 기록 시트가 열려 있는 동안에는 어디에 떨어뜨려도 브라우저가 그 파일을 열어 버리지 않게 */
    e.preventDefault();
    if (e.dataTransfer) { try { e.dataTransfer.dropEffect = 'copy'; } catch (err) { } }
    var box = dropBoxOf(e.target);
    if (box && !box.classList.contains('dragging')) box.classList.add('dragging');
  });

  document.addEventListener('dragleave', function (e) {
    var box = dropBoxOf(e.target);
    if (box && !(e.relatedTarget && box.contains(e.relatedTarget))) box.classList.remove('dragging');
  });

  document.addEventListener('drop', function (e) {
    var box = dropBoxOf(e.target);
    if (!box) return;
    e.preventDefault();
    box.classList.remove('dragging');
    var dt = e.dataTransfer;
    var file = dt && dt.files && dt.files[0];
    if (file) attachPhotoFile(file);
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && sheet) { closeSheet(); return; }
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var card = e.target.closest ? e.target.closest('.rcard[data-act]') : null;
    if (!card) return;
    e.preventDefault();
    var fn = actions[card.dataset.act];
    if (fn) fn(card);
  });

  /* ------------------------------------------------------------------ *
   *  시작 — 첫 화면은 캐시(빠르게), IndexedDB 사진은 이어서
   * ------------------------------------------------------------------ */
  render();

  var ready = (function () {
    if (!HAS_IDB) return Promise.resolve(false);
    return loadDbRecords().then(function (rows) {
      if (!rows) return false;
      if (rows.length) {
        var dbRecs = rows.map(normRecord).filter(Boolean);
        var merged = mergeRecords(state.records, dbRecs, state.removed || {});
        state.records = merged.records;
        persist();
        safeRender();
        return true;
      }
      if (state.records.length) saveDb(state.records);
      return true;
    }, function () { return false; });
  })();

  bootSync();

  /* 테스트용 훅 (앱 동작에는 영향 없음) */
  window.__drinkApp = {
    get state() { return state; },
    set state(v) { state = normState(v); persist(); render(); },
    get ui() { return ui; },
    get sheet() { return sheet; },
    ready: ready,
    flush: function () { return pendingWrites; },
    hasIdb: function () { return HAS_IDB; },
    storageMode: function () { return HAS_IDB ? 'indexeddb' : (canStore ? 'localstorage' : 'none'); },
    helpers: {
      todayKey: todayKey, dkey: dkey, parseKey: parseKey, isDateKey: isDateKey,
      comma: comma, won: won, int: int, fmtRating: fmtRating, fmtDate: fmtDate,
      fmtMonthKey: fmtMonthKey, fmtLongDate: fmtLongDate, starText: starText,
      bytesText: bytesText, dataBytes: dataBytes, normRating: normRating
    },
    cats: CATS.slice(),
    catOf: catOf,
    filtered: filtered,
    summary: summary,
    stats: stats,
    monthGroups: monthGroups,
    addRecord: addRecord,
    updateRecord: updateRecord,
    delRecord: delRecord,
    seedState: seedState,
    emptyState: emptyState,
    normalize: normState,
    normalizeRecord: normRecord,
    csvText: csvText,
    jsonText: jsonText,
    importObject: importObject,
    readForm: readForm,
    render: render,
    openSheet: openSheet,
    closeSheet: closeSheet,
    openRecord: openRecordSheet,
    draft: { key: KEY_DRAFT, peek: draftPeek, save: draftCommit, clear: draftClear, flush: draftFlush },
    toast: toast,
    compressPhoto: compressPhoto,
    attachPhotoFile: attachPhotoFile,
    actions: actions,
    forms: forms,
    photoLimits: { maxDim: MAXDIM, quality: QUALITY, cap: PHOTO_CAP },
    version: APP_VER,
    withSample: function () { return WITH_SAMPLE; },
    /* 남편 연동 */
    sync: sync,
    syncStatusText: syncStatusText,
    syncPull: syncPull,
    syncPushAll: syncPushAll,
    syncPushRecord: syncPushRecord,
    syncDelRecord: syncDelRecord,
    syncDisconnect: syncDisconnect,
    setRoom: setRoom,
    encodeRoomKey: encodeRoomKey,
    decodeRoomKey: decodeRoomKey,
    mergeRecords: mergeRecords,
    inviteLink: inviteLink,
    dbUrl: DB_URL
  };
})();

</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
</body>
</html>
